    // 中央に1つだけ立つ木製ドア＆モダン白枠
    function buildDoor() {
      doorGroup = new THREE.Group();
      const woodTex = createWoodTexture();

      const frameMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.32, metalness: 0.08 });
      const doorMat = new THREE.MeshStandardMaterial({ map: woodTex, color: 0xdca57c, roughness: 0.52, metalness: 0.05 });
      const panelMat = new THREE.MeshStandardMaterial({ map: woodTex, color: 0xc2875c, roughness: 0.58 });
      const brassMat = new THREE.MeshStandardMaterial({ color: 0xf5c869, roughness: 0.22, metalness: 0.88 });

      const fThick = 0.16;
      const fDepth = 0.24;

      const leftPost = new THREE.Mesh(new THREE.BoxGeometry(fThick, DOOR_HEIGHT + fThick, fDepth), frameMat);
      leftPost.position.set(-DOOR_WIDTH / 2 - fThick / 2, (DOOR_HEIGHT + fThick) / 2, 0.04);
      leftPost.castShadow = leftPost.receiveShadow = true;

      const rightPost = new THREE.Mesh(new THREE.BoxGeometry(fThick, DOOR_HEIGHT + fThick, fDepth), frameMat);
      rightPost.position.set(DOOR_WIDTH / 2 + fThick / 2, (DOOR_HEIGHT + fThick) / 2, 0.04);
      rightPost.castShadow = rightPost.receiveShadow = true;

      const topBar = new THREE.Mesh(new THREE.BoxGeometry(DOOR_WIDTH + fThick * 2, fThick, fDepth), frameMat);
      topBar.position.set(0, DOOR_HEIGHT + fThick / 2, 0.04);
      topBar.castShadow = topBar.receiveShadow = true;

      const threshold = new THREE.Mesh(new THREE.BoxGeometry(DOOR_WIDTH + fThick * 2 + 0.16, 0.04, fDepth + 0.14), frameMat);
      threshold.position.set(0, 0.02, 0.04);
      threshold.receiveShadow = true;

      doorGroup.add(leftPost, rightPost, topBar, threshold);

      // 生成時に一瞬光るポータルリム
      const glowEdges = new THREE.EdgesGeometry(new THREE.BoxGeometry(DOOR_WIDTH + 0.04, DOOR_HEIGHT + 0.04, 0.04));
      doorGlowMesh = new THREE.LineSegments(
        glowEdges,
        new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0 })
      );
      doorGlowMesh.position.set(0, DOOR_HEIGHT / 2, 0.04);
      doorGroup.add(doorGlowMesh);

      // 扉ヒンジピボット
      doorPivot = new THREE.Group();
      doorPivot.position.set(-DOOR_WIDTH / 2, 0, 0.04);
      doorGroup.add(doorPivot);

      const leaf = new THREE.Mesh(new THREE.BoxGeometry(DOOR_WIDTH, DOOR_HEIGHT, 0.08), doorMat);
      leaf.position.set(DOOR_WIDTH / 2, DOOR_HEIGHT / 2, 0);
      leaf.castShadow = leaf.receiveShadow = true;
      doorPivot.add(leaf);

      // 表裏の装飾パネルと真鍮ドアノブ
      [-0.044, 0.044].forEach((zOff) => {
        const up = new THREE.Mesh(new THREE.BoxGeometry(1.45, 1.25, 0.014), panelMat);
        up.position.set(DOOR_WIDTH / 2, 2.3, zOff);
        const low = new THREE.Mesh(new THREE.BoxGeometry(1.45, 1.1, 0.014), panelMat);
        low.position.set(DOOR_WIDTH / 2, 0.88, zOff);
        doorPivot.add(up, low);
      });

      [-0.095, 0.095].forEach((zOff) => {
        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.08, 12), brassMat);
        stem.rotation.x = Math.PI / 2;
        stem.position.set(DOOR_WIDTH - 0.22, 1.5, zOff * 0.58);
        const knob = new THREE.Mesh(new THREE.SphereGeometry(0.065, 16, 16), brassMat);
        knob.position.set(DOOR_WIDTH - 0.22, 1.5, zOff);
        doorPivot.add(stem, knob);
      });
    }

    // 双方向ポータル用ステンシルマスク
    function buildPortalMasks() {
      const geo = new THREE.PlaneGeometry(DOOR_WIDTH, DOOR_HEIGHT);
      const createMaskMat = () => new THREE.MeshBasicMaterial({
        colorWrite: false,
        depthWrite: false,
        depthTest: true,
        side: THREE.FrontSide, // 裏側からは描画されない
        stencilWrite: true,
        stencilRef: 1,
        stencilFunc: THREE.AlwaysStencilFunc,
        stencilFail: THREE.KeepStencilOp,
        stencilZFail: THREE.KeepStencilOp,
        stencilZPass: THREE.ReplaceStencilOp
      });

      // 待機空間(+Z)から見て、閉じた扉よりわずかに奥(z=-0.01)
      portalMaskFront = new THREE.Mesh(geo, createMaskMat());
      portalMaskFront.position.set(0, DOOR_HEIGHT / 2, -0.01);
      maskScene.add(portalMaskFront);

      // 異空間(-Z)から見て、閉じた扉よりわずかに奥(z=+0.09, -Z向き)
      portalMaskBack = new THREE.Mesh(geo, createMaskMat());
      portalMaskBack.position.set(0, DOOR_HEIGHT / 2, 0.09);
      portalMaskBack.rotation.y = Math.PI;
      portalMaskBack.visible = false;
      maskScene.add(portalMaskBack);
    }

    function applyStencilTestToScene(scene, enableTest) {
      scene.traverse((obj) => {
        if (!obj.material) return;
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach((mat) => {
          if (enableTest) {
            mat.stencilWrite = true;
            mat.stencilRef = 1;
            mat.stencilFunc = THREE.EqualStencilFunc;
            mat.stencilFail = THREE.KeepStencilOp;
            mat.stencilZFail = THREE.KeepStencilOp;
            mat.stencilZPass = THREE.KeepStencilOp;
          } else {
            mat.stencilWrite = false;
            mat.stencilFunc = THREE.AlwaysStencilFunc;
          }
        });
      });
    }

    // =========================================================================
    // 7. プロシージャル3D世界＆多彩なランドマーク構築
    // =========================================================================
    function clearPortalWorld() {
      animatedWaterMesh = null;
      animatedAuroraMesh = null;
      animatedFloaters = [];
      animatedPlanets = [];
      particleSystem = null;
      particleMeta = null;

      while (portalDynamicGroup.children.length > 0) {
        const child = portalDynamicGroup.children[0];
        portalDynamicGroup.remove(child);
        child.traverse((obj) => {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
            mats.forEach((m) => m.dispose());
          }
        });
      }
    }

    function buildPortalWorld(world) {
      clearPortalWorld();
      const rng = createSeededRng(world.seed ^ 0x9e3779b9);

      // 霧
      portalScene.fog = new THREE.FogExp2(new THREE.Color(world.fogColor), world.fogDensity);

      // 空ドーム
      portalDynamicGroup.add(createSkyDome(world.skyTopColor, world.skyMidColor, world.skyBottomColor));

      // ライティング
      const lightCol = new THREE.Color(world.lightColor);
      portalDynamicGroup.add(new THREE.AmbientLight(lightCol, 0.45 * world.lightIntensity));
      portalDynamicGroup.add(new THREE.HemisphereLight(new THREE.Color(world.skyMidColor), new THREE.Color('#334155'), 0.55 * world.lightIntensity));
      const sun = new THREE.DirectionalLight(lightCol, 0.95 * world.lightIntensity);
      sun.position.set(16, 28, -22);
      portalDynamicGroup.add(sun);

      // 天体・オーロラ
      buildCelestials(world, rng);

      // 地面・水面
      buildGround(world);

      // 複数ランドマークの構築
      world.landmarks.forEach((lm, idx) => {
        buildLandmark(lm, world, rng, idx);
      });

      // パーティクル
      buildParticles(world, rng);

      // ステンシル状態同期
      applyStencilTestToScene(portalScene, !state.inWorld);
    }

    function buildCelestials(world, rng) {
      const cType = world.celestialType;

      if (cType === 'sun') {
        const isSunset = world.timeKey === 'sunset' || world.groundKey === 'volcano';
        const sunPos = isSunset ? new THREE.Vector3(12, 13, -82) : new THREE.Vector3(20, 32, -78);
        const sunMesh = new THREE.Mesh(
          new THREE.SphereGeometry(isSunset ? 7.5 : 5.2, 24, 24),
          new THREE.MeshBasicMaterial({ color: isSunset ? 0xfb923c : 0xfff7cc, fog: false })
        );
        sunMesh.position.copy(sunPos);
        portalDynamicGroup.add(sunMesh);

        const halo = new THREE.Mesh(
          new THREE.RingGeometry(isSunset ? 8.0 : 5.8, isSunset ? 13.5 : 9.5, 32),
          new THREE.MeshBasicMaterial({ color: isSunset ? 0xfdba74 : 0xfef08a, transparent: true, opacity: 0.25, side: THREE.DoubleSide, fog: false })
        );
        halo.position.copy(sunPos);
        halo.lookAt(0, EYE_HEIGHT, 0);
        portalDynamicGroup.add(halo);
      }

      if (cType === 'moon' || cType === 'stars' || cType === 'aurora') {
        const count = cType === 'stars' ? 1500 : 800;
        const pos = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
          const theta = rng() * Math.PI * 2;
          const phi = Math.acos(rng() * 0.88 + 0.08);
          const r = 135 + rng() * 25;
          pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
          pos[i * 3 + 1] = r * Math.cos(phi);
          pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        portalDynamicGroup.add(new THREE.Points(geo, new THREE.PointsMaterial({
          color: 0xffffff,
          size: cType === 'stars' ? 1.15 : 0.9,
          transparent: true,
          opacity: 0.92,
          fog: false
        })));
      }

      if (cType === 'moon') {
        const moon = new THREE.Mesh(
          new THREE.SphereGeometry(6.2, 24, 24),
          new THREE.MeshBasicMaterial({ color: 0xfef9c3, fog: false })
        );
        moon.position.set(-16, 28, -82);
        portalDynamicGroup.add(moon);
      }

      if (cType === 'aurora') {
        const geo = new THREE.PlaneGeometry(140, 28, 48, 8);
        const mat = new THREE.ShaderMaterial({
          uniforms: {
            uTime: { value: 0 },
            uCol1: { value: new THREE.Color('#22d3ee') },
            uCol2: { value: new THREE.Color('#4ade80') },
            uCol3: { value: new THREE.Color('#a855f7') }
          },
          vertexShader: `
            uniform float uTime;
            varying vec2 vUv;
            void main() {
              vUv = uv;
              vec3 p = position;
              p.z += sin(p.x * 0.08 + uTime * 0.8) * 6.5;
              p.y += cos(p.x * 0.05 + uTime * 0.5) * 2.5;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
            }
          `,
          fragmentShader: `
            uniform float uTime;
            uniform vec3 uCol1;
            uniform vec3 uCol2;
            uniform vec3 uCol3;
            varying vec2 vUv;
            void main() {
              float w = sin(vUv.x * 12.0 + uTime * 1.1) * 0.5 + 0.5;
              vec3 col = mix(uCol2, uCol1, w);
              col = mix(col, uCol3, smoothstep(0.55, 1.0, vUv.y));
              float a = sin(vUv.y * 3.14159) * smoothstep(0.0, 0.22, vUv.x) * smoothstep(1.0, 0.78, vUv.x);
              a *= (0.38 + 0.36 * sin(vUv.x * 18.0 - uTime * 1.5));
              gl_FragColor = vec4(col, a * 0.88);
            }
          `,
          transparent: true,
          side: THREE.DoubleSide,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          fog: false
        });
        animatedAuroraMesh = new THREE.Mesh(geo, mat);
        animatedAuroraMesh.position.set(0, 32, -62);
        animatedAuroraMesh.rotation.x = 0.2;
        portalDynamicGroup.add(animatedAuroraMesh);
      }
    }

    function buildGround(world) {
      const g = world.groundKey;

      if (g === 'space') {
        const walkway = new THREE.Mesh(
          new THREE.BoxGeometry(3.6, 0.14, 56),
          new THREE.MeshStandardMaterial({
            color: 0x1e293b,
            emissive: new THREE.Color(world.accentColor),
            emissiveIntensity: 0.28,
            roughness: 0.15,
            metalness: 0.75,
            transparent: true,
            opacity: 0.85
          })
        );
        walkway.position.set(0, -0.07, -24);
        portalDynamicGroup.add(walkway);

        [-1.75, 1.75].forEach((x) => {
          const rail = new THREE.Mesh(
            new THREE.BoxGeometry(0.08, 0.08, 56),
            new THREE.MeshBasicMaterial({ color: world.accentColor })
          );
          rail.position.set(x, 0.02, -24);
          portalDynamicGroup.add(rail);
        });
        return;
      }

      if (g === 'ocean') {
        // 波打つ海面
        const waterGeo = new THREE.PlaneGeometry(190, 190, 48, 48);
        waterGeo.rotateX(-Math.PI / 2);
        const waterColor = world.timeKey === 'night' ? 0x0c4a6e : (world.timeKey === 'sunset' ? 0x0e7490 : 0x06b6d4);
        animatedWaterMesh = new THREE.Mesh(
          waterGeo,
          new THREE.MeshStandardMaterial({ color: waterColor, roughness: 0.18, metalness: 0.4, flatShading: true })
        );
        animatedWaterMesh.position.y = -0.18;
        portalDynamicGroup.add(animatedWaterMesh);

        // ドア周りの砂浜の小島＋海へ伸びる木製桟橋
        const sandIsland = new THREE.Mesh(
          new THREE.CylinderGeometry(7.5, 9.5, 0.45, 24),
          new THREE.MeshStandardMaterial({ color: 0xfde68a, roughness: 0.92 })
        );
        sandIsland.position.set(0, -0.22, -2.5);
        portalDynamicGroup.add(sandIsland);

        const pier = new THREE.Mesh(
          new THREE.BoxGeometry(2.5, 0.16, 30),
          new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.82 })
        );
        pier.position.set(0, 0.02, -18);
        portalDynamicGroup.add(pier);
        return;
      }

      if (g === 'city') {
        const floor = new THREE.Mesh(
          new THREE.PlaneGeometry(190, 190),
          new THREE.MeshStandardMaterial({
            map: createCityRoadTexture(world.accentColor),
            roughness: 0.25,
            metalness: 0.6
          })
        );
        floor.rotation.x = -Math.PI / 2;
        portalDynamicGroup.add(floor);
        return;
      }

      // 起伏のある地形（grass / snow / desert / stone / volcano）
      const colorMap = {
        grass: '#4d7c0f',
        snow: '#e2e8f0',
        desert: '#e6b873',
        stone: '#475569',
        volcano: '#292524'
      };
      const geo = new THREE.PlaneGeometry(190, 190, 56, 56);
      geo.rotateX(-Math.PI / 2);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const flatPath = Math.min(1, Math.max(0, (Math.abs(x) - 2.6) / 5.5)) *
                         Math.min(1, Math.max(0, (Math.hypot(x, z) - 4.0) / 5.0));
        const amp = g === 'desert' ? 2.2 : (g === 'volcano' ? 2.5 : 1.5);
        const hill = (Math.sin(x * 0.075) * Math.cos(z * 0.075) * amp + Math.sin(x * 0.2 + z * 0.14) * 0.45) * flatPath;
        pos.setY(i, hill);
      }
      geo.computeVertexNormals();

      const terrain = new THREE.Mesh(
        geo,
        new THREE.MeshStandardMaterial({
          color: colorMap[g] || '#4d7c0f',
          roughness: g === 'snow' ? 0.55 : 0.9,
          metalness: 0.04,
          flatShading: true
        })
      );
      portalDynamicGroup.add(terrain);

      // 火山なら光る溶岩の川
      if (g === 'volcano') {
        const lava = new THREE.Mesh(
          new THREE.PlaneGeometry(190, 190),
          new THREE.MeshBasicMaterial({ color: 0xea580c })
        );
        lava.rotation.x = -Math.PI / 2;
        lava.position.y = -0.45;
        portalDynamicGroup.add(lava);
      }

      // 参道・小道
      if (g === 'grass' || g === 'stone' || g === 'volcano') {
        const pathCol = g === 'volcano' ? 0x44403c : (g === 'stone' ? 0x64748b : 0xd6cfc2);
        const path = new THREE.Mesh(
          new THREE.PlaneGeometry(2.8, 56),
          new THREE.MeshStandardMaterial({ color: pathCol, roughness: 0.92 })
        );
        path.rotation.x = -Math.PI / 2;
        path.position.set(0, 0.025, -26);
        portalDynamicGroup.add(path);
      }
    }

    // --- 個別ランドマーク生成 ---
    function buildLandmark(type, world, rng, slotIndex) {
      if (type === 'castle') {
        // 天守閣と石垣のある日本のお城（正面奥に堂々と配置）
        const castle = new THREE.Group();
        const stoneMat = new THREE.MeshStandardMaterial({ map: createStoneWallTexture(), roughness: 0.88 });
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.55 });
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.45, flatShading: true });
        const goldMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.8, roughness: 0.25 });

        // 石垣台座
        const base = new THREE.Mesh(new THREE.CylinderGeometry(6.2, 8.0, 4.2, 4), stoneMat);
        base.rotation.y = Math.PI / 4;
        base.position.y = 2.1;
        castle.add(base);

        // 3層の天守閣
        const tiers = [
          { w: 7.4, h: 3.0, y: 5.7, roofR: 6.8 },
          { w: 5.4, h: 2.6, y: 8.5, roofR: 5.2 },
          { w: 3.6, h: 2.3, y: 11.0, roofR: 3.8 }
        ];
        tiers.forEach((t) => {
          const wall = new THREE.Mesh(new THREE.BoxGeometry(t.w, t.h, t.w), wallMat);
          wall.position.y = t.y;
          castle.add(wall);

          const roof = new THREE.Mesh(new THREE.ConeGeometry(t.roofR, 1.5, 4), roofMat);
          roof.rotation.y = Math.PI / 4;
          roof.position.y = t.y + t.h / 2 + 0.55;
          castle.add(roof);
        });

        // 金のしゃちほこ
        [-0.7, 0.7].forEach((sx) => {
          const shachi = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.9, 6), goldMat);
          shachi.position.set(sx, 13.4, 0);
          shachi.rotation.z = sx > 0 ? -0.25 : 0.25;
          castle.add(shachi);
        });

        castle.position.set(slotIndex === 0 ? 0 : 7.5, 0, -26);
        portalDynamicGroup.add(castle);
        return;
      }

      if (type === 'tokyo_tower') {
        // 東京タワー風の赤白鉄塔
        const tower = new THREE.Group();
        const redMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0x991b1b, emissiveIntensity: 0.35, roughness: 0.4 });
        const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, emissive: 0x64748b, emissiveIntensity: 0.2, roughness: 0.4 });
        const glowMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });

        const segments = [
          { rTop: 2.4, rBot: 4.5, h: 6.0, y: 3.0, mat: redMat },
          { rTop: 1.5, rBot: 2.4, h: 5.0, y: 8.5, mat: whiteMat },
          { rTop: 1.0, rBot: 1.5, h: 4.8, y: 13.4, mat: redMat },
          { rTop: 0.5, rBot: 1.0, h: 4.6, y: 18.1, mat: whiteMat },
          { rTop: 0.12, rBot: 0.5, h: 4.8, y: 22.8, mat: redMat }
        ];
        segments.forEach((s) => {
          const seg = new THREE.Mesh(new THREE.CylinderGeometry(s.rTop, s.rBot, s.h, 4, 1, false), s.mat);
          seg.rotation.y = Math.PI / 4;
          seg.position.y = s.y;
          tower.add(seg);
        });

        // メインデッキ＆トップデッキ
        const deck1 = new THREE.Mesh(new THREE.BoxGeometry(4.2, 1.3, 4.2), whiteMat);
        deck1.position.y = 11.2;
        const deck1Light = new THREE.Mesh(new THREE.BoxGeometry(4.35, 0.35, 4.35), glowMat);
        deck1Light.position.y = 11.2;

        const deck2 = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.9, 2.1), whiteMat);
        deck2.position.y = 18.8;
        const deck2Light = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.28, 2.2), glowMat);
        deck2Light.position.y = 18.8;

        const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.12, 4.0, 8), whiteMat);
        antenna.position.y = 27.0;

        tower.add(deck1, deck1Light, deck2, deck2Light, antenna);
        tower.position.set(0, 0, -28);
        portalDynamicGroup.add(tower);
        return;
      }

      if (type === 'torii') {
        const redMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.45 });
        const darkMat = new THREE.MeshStandardMaterial({ color: 0x1c1917, roughness: 0.7 });
        const glowMat = new THREE.MeshBasicMaterial({ color: 0xfde047 });

        for (let i = 0; i < 16; i++) {
          const gate = new THREE.Group();
          gate.position.set(0, 0, -4.0 - i * 2.6);

          const pGeo = new THREE.CylinderGeometry(0.12, 0.15, 3.6, 10);
          const lp = new THREE.Mesh(pGeo, redMat); lp.position.set(-1.5, 1.8, 0);
          const rp = new THREE.Mesh(pGeo, redMat); rp.position.set(1.5, 1.8, 0);
          const beam = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.22, 0.28), redMat); beam.position.set(0, 3.62, 0);
          const cap = new THREE.Mesh(new THREE.BoxGeometry(4.3, 0.14, 0.34), darkMat); cap.position.set(0, 3.78, 0);
          const sub = new THREE.Mesh(new THREE.BoxGeometry(3.3, 0.15, 0.18), redMat); sub.position.set(0, 3.05, 0);
          gate.add(lp, rp, beam, cap, sub);

          if (i % 3 === 0) {
            [-2.5, 2.5].forEach((lx) => {
              const b = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.24, 1.1, 6), darkMat); b.position.set(lx, 0.55, 0);
              const l = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.32, 0.26), glowMat); l.position.set(lx, 1.25, 0);
              const r = new THREE.Mesh(new THREE.ConeGeometry(0.38, 0.26, 6), darkMat); r.position.set(lx, 1.54, 0);
              gate.add(b, l, r);
            });
          }
          portalDynamicGroup.add(gate);
        }
        return;
      }

      if (type === 'pyramid') {
        const sandMat = new THREE.MeshStandardMaterial({ color: 0xd9a05b, roughness: 0.85, flatShading: true });
        const configs = [
          { x: -12, z: -32, r: 14, h: 15 },
          { x: 14, z: -42, r: 18, h: 19 },
          { x: -24, z: -48, r: 10, h: 11 }
        ];
        configs.forEach((c) => {
          const pyr = new THREE.Mesh(new THREE.ConeGeometry(c.r, c.h, 4), sandMat);
          pyr.rotation.y = Math.PI / 4;
          pyr.position.set(c.x, c.h / 2 - 0.3, c.z);
          portalDynamicGroup.add(pyr);
        });
        return;
      }

      if (type === 'ruins') {
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, roughness: 0.85, flatShading: true });
        for (let i = 0; i < 14; i++) {
          const side = i % 2 === 0 ? -1 : 1;
          const row = Math.floor(i / 2);
          const x = side * (4.2 + (row % 2) * 1.4);
          const z = -5.0 - row * 4.5;
          const broken = rng() > 0.65;
          const h = broken ? (2.2 + rng() * 2.5) : 5.6;

          const col = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.44, h, 10), stoneMat);
          col.position.set(x, h / 2, z);
          portalDynamicGroup.add(col);

          const base = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.35, 1.1), stoneMat);
          base.position.set(x, 0.175, z);
          portalDynamicGroup.add(base);

          if (!broken && row % 2 === 0) {
            const lintel = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.45, 5.2), stoneMat);
            lintel.position.set(x, h + 0.22, z - 2.2);
            portalDynamicGroup.add(lintel);
          }
        }
        return;
      }

      if (type === 'planets') {
        const palette = [0x60a5fa, 0xf472b6, 0xfbbf24, 0xa78bfa, 0x34d399];
        for (let i = 0; i < 14; i++) {
          const r = i === 0 ? 7.8 : (1.3 + rng() * 3.8);
          const g = new THREE.Group();
          const sphere = new THREE.Mesh(
            new THREE.SphereGeometry(r, 24, 24),
            new THREE.MeshStandardMaterial({ color: palette[i % palette.length], roughness: 0.6, metalness: 0.15 })
          );
          g.add(sphere);
          if (i % 2 === 0) {
            const ring = new THREE.Mesh(
              new THREE.RingGeometry(r * 1.35, r * 1.85, 36),
              new THREE.MeshBasicMaterial({ color: world.accentColor, side: THREE.DoubleSide, transparent: true, opacity: 0.55 })
            );
            ring.rotation.x = Math.PI * 0.42;
            ring.rotation.y = (rng() - 0.5) * 0.5;
            g.add(ring);
          }
          if (i === 0) {
            g.position.set(9, 11, -36);
          } else {
            const ang = (i / 13) * Math.PI * 2;
            const dist = 18 + rng() * 38;
            g.position.set(Math.cos(ang) * dist, (rng() - 0.3) * 26, -12 - Math.abs(Math.sin(ang) * dist));
          }
          g.userData.rotSpeed = 0.08 + rng() * 0.22;
          animatedPlanets.push(g);
          portalDynamicGroup.add(g);
        }
        return;
      }

      if (type === 'crystals') {
        const mainCol = new THREE.Color(world.accentColor);
        const cMat = new THREE.MeshStandardMaterial({
          color: mainCol,
          emissive: mainCol,
          emissiveIntensity: 0.5,
          roughness: 0.15,
          metalness: 0.35,
          transparent: true,
          opacity: 0.88,
          flatShading: true
        });
        for (let i = 0; i < 24; i++) {
          const ang = rng() * Math.PI * 2;
          const dist = 5.5 + rng() * 30;
          let x = Math.cos(ang) * dist;
          let z = Math.sin(ang) * dist - 12;
          if (Math.abs(x) < 2.8 && z > -22 && z < 4) x += x >= 0 ? 3.5 : -3.5;

          const floating = i % 3 === 0;
          const h = 1.6 + rng() * 3.0;
          const r = 0.35 + rng() * 0.45;
          const shard = new THREE.Mesh(new THREE.OctahedronGeometry(r, 0), cMat);
          shard.scale.set(1, h / (r * 2), 1);
          const baseY = floating ? (2.2 + rng() * 4.5) : (h * 0.42);
          shard.position.set(x, baseY, z);
          shard.rotation.z = (rng() - 0.5) * 0.35;

          if (floating) {
            shard.userData = { baseY, phase: rng() * Math.PI * 2, speed: 0.9 + rng() * 0.9 };
            animatedFloaters.push(shard);
          }
          portalDynamicGroup.add(shard);
        }
        return;
      }

      if (type === 'bamboo') {
        const stemMat = new THREE.MeshStandardMaterial({ color: 0x3f6212, roughness: 0.6 });
        const nodeMat = new THREE.MeshStandardMaterial({ color: 0x84cc16, roughness: 0.7 });
        const leafMat = new THREE.MeshStandardMaterial({ color: 0x4d7c0f, roughness: 0.8, side: THREE.DoubleSide });

        for (let i = 0; i < 65; i++) {
          const side = i % 2 === 0 ? -1 : 1;
          const x = side * (3.2 + rng() * 18);
          const z = -2.5 - rng() * 42;
          const h = 7.5 + rng() * 6.5;

          const g = new THREE.Group();
          const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.13, h, 7), stemMat);
          stalk.position.y = h / 2;
          g.add(stalk);

          for (let ny = 1.6; ny < h - 1; ny += 1.8) {
            const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.135, 0.135, 0.08, 7), nodeMat);
            ring.position.y = ny;
            g.add(ring);
          }
          const crown = new THREE.Mesh(new THREE.ConeGeometry(0.9, 1.8, 5), leafMat);
          crown.position.y = h;
          g.add(crown);

          g.position.set(x, 0, z);
          g.rotation.z = (rng() - 0.5) * 0.08;
          portalDynamicGroup.add(g);
        }
        return;
      }

      if (type === 'buildings') {
        const bTex = createBuildingWindowTexture('#141a2e', world.accentColor);
        const bMat = new THREE.MeshStandardMaterial({
          map: bTex,
          emissive: new THREE.Color(world.accentColor),
          emissiveMap: bTex,
          emissiveIntensity: 0.6,
          roughness: 0.3,
          metalness: 0.55
        });
        const neonMat = new THREE.MeshBasicMaterial({ color: world.accentColor });

        for (let i = 0; i < 34; i++) {
          const side = i % 2 === 0 ? -1 : 1;
          const row = Math.floor(i / 2);
          const x = side * (4.8 + (row % 3) * 4.4 + rng() * 2.5);
          const z = -4.0 - row * 3.0 - rng() * 2.0;
          const bw = 2.4 + rng() * 2.8;
          const bd = 2.4 + rng() * 2.8;
          const bh = 7.0 + rng() * 20.0;

          const box = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), bMat);
          box.position.set(x, bh / 2, z);
          portalDynamicGroup.add(box);

          const rim = new THREE.Mesh(new THREE.BoxGeometry(bw + 0.1, 0.16, bd + 0.1), neonMat);
          rim.position.set(x, bh + 0.08, z);
          portalDynamicGroup.add(rim);
        }
        return;
      }

      if (type === 'mountains') {
        const isSnow = world.groundKey === 'snow';
        const isVolcano = world.groundKey === 'volcano';
        const bodyCol = isVolcano ? 0x292524 : (isSnow ? 0x334155 : 0x3f6212);
        const peakCol = isVolcano ? 0xf97316 : (isSnow ? 0xf8fafc : 0x65a30d);

        for (let i = 0; i < 20; i++) {
          const ang = (i / 20) * Math.PI * 2 + (rng() - 0.5) * 0.2;
          const dist = 30 + rng() * 32;
          const r = 9 + rng() * 12;
          const h = 15 + rng() * 22;

          const g = new THREE.Group();
          const mt = new THREE.Mesh(new THREE.ConeGeometry(r, h, 6), new THREE.MeshStandardMaterial({ color: bodyCol, roughness: 0.9, flatShading: true }));
          mt.position.y = h / 2 - 0.5;
          const pk = new THREE.Mesh(new THREE.ConeGeometry(r * 0.35, h * 0.35, 6), new THREE.MeshStandardMaterial({ color: peakCol, emissive: isVolcano ? 0xea580c : 0x000000, emissiveIntensity: isVolcano ? 0.6 : 0, roughness: 0.6, flatShading: true }));
          pk.position.y = h * 0.83 - 0.5;
          g.add(mt, pk);
          g.position.set(Math.cos(ang) * dist, 0, Math.sin(ang) * dist - 14);
          portalDynamicGroup.add(g);
        }
        return;
      }

      if (type === 'palm') {
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x854d0e, roughness: 0.9 });
        const leafMat = new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.75, side: THREE.DoubleSide });

        for (let i = 0; i < 10; i++) {
          const ang = (i / 10) * Math.PI * 2;
          const dist = 4.2 + rng() * 3.0;
          const x = Math.cos(ang) * dist;
          const z = Math.sin(ang) * dist - 2.8;
          if (Math.abs(x) < 2.2 && z > -5 && z < 2) continue;

          const palm = new THREE.Group();
          const h = 4.0 + rng() * 2.0;
          const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.24, h, 7), trunkMat);
          trunk.position.y = h / 2;
          trunk.rotation.z = (rng() - 0.5) * 0.22;
          palm.add(trunk);

          for (let f = 0; f < 6; f++) {
            const frond = new THREE.Mesh(new THREE.ConeGeometry(0.45, 2.4, 4), leafMat);
            frond.position.set(0, h, 0);
            frond.rotation.z = Math.PI * 0.42;
            frond.rotation.y = (f / 6) * Math.PI * 2;
            frond.translateY(1.0);
            palm.add(frond);
          }
          palm.position.set(x, 0, z);
          portalDynamicGroup.add(palm);
        }
        return;
      }

      // sakura / pine / trees
      const count = type === 'sakura' ? 28 : 34;
      for (let i = 0; i < count; i++) {
        let x, z;
        if (type === 'sakura') {
          const side = i % 2 === 0 ? -1 : 1;
          const row = Math.floor(i / 2);
          x = side * (3.8 + (row % 2) * 3.2 + rng() * 1.8);
          z = -3.5 - row * 2.9 - rng() * 1.6;
        } else {
          const ang = rng() * Math.PI * 2;
          const dist = 5.5 + rng() * 34;
          x = Math.cos(ang) * dist;
          z = Math.sin(ang) * dist - 10;
          if (Math.abs(x) < 3.0 && z > -24 && z < 4) x += x >= 0 ? 3.8 : -3.8;
        }

        const sc = 0.78 + rng() * 0.7;
        const tree = new THREE.Group();

        if (type === 'pine') {
          const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14 * sc, 0.24 * sc, 1.4 * sc, 6), new THREE.MeshStandardMaterial({ color: 0x4b3621 }));
          trunk.position.y = 0.7 * sc;
          tree.add(trunk);
          const pMat = new THREE.MeshStandardMaterial({ color: 0x14532d, roughness: 0.8, flatShading: true });
          for (let t = 0; t < 3; t++) {
            const cone = new THREE.Mesh(new THREE.ConeGeometry((1.35 - t * 0.3) * sc, (1.85 - t * 0.25) * sc, 7), pMat);
            cone.position.y = (1.65 + t * 1.1) * sc;
            tree.add(cone);
          }
          if (world.groundKey === 'snow') {
            const cap = new THREE.Mesh(new THREE.ConeGeometry(0.62 * sc, 0.9 * sc, 7), new THREE.MeshStandardMaterial({ color: 0xf8fafc, flatShading: true }));
            cap.position.y = 4.35 * sc;
            tree.add(cap);
          }
        } else {
          const isSakura = type === 'sakura';
          const trunk = new THREE.Mesh(
            new THREE.CylinderGeometry(0.14 * sc, 0.25 * sc, 2.2 * sc, 7),
            new THREE.MeshStandardMaterial({ color: isSakura ? 0x4a3228 : 0x5c4033, roughness: 0.9 })
          );
          trunk.position.y = 1.1 * sc;
          tree.add(trunk);

          const col = isSakura ? (rng() > 0.4 ? 0xf9a8d4 : 0xfbcfe8) : (rng() > 0.4 ? 0x15803d : 0x22c55e);
          const lMat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.75, flatShading: true });
          [[0, 2.6, 0, 1.25], [-0.7, 2.2, 0.4, 0.85], [0.75, 2.3, -0.35, 0.9], [0.15, 3.2, 0.2, 0.8]].forEach(([cx, cy, cz, cr]) => {
            const puff = new THREE.Mesh(new THREE.DodecahedronGeometry(cr * sc, 0), lMat);
            puff.position.set(cx * sc, cy * sc, cz * sc);
            tree.add(puff);
          });
        }

        tree.position.set(x, 0, z);
        portalDynamicGroup.add(tree);
      }
    }

    function buildParticles(world, rng) {
      const type = world.particleKey;
      if (!type || type === 'none') return;

      const count = type === 'rain' ? 950 : 480;
      const positions = new Float32Array(count * 3);
      const speeds = new Float32Array(count);
      const phases = new Float32Array(count);

      for (let i = 0; i < count; i++) {
        positions[i * 3] = (rng() - 0.5) * 58;
        positions[i * 3 + 1] = rng() * 24;
        positions[i * 3 + 2] = (rng() - 0.5) * 68 - 12;
        speeds[i] = 0.6 + rng() * 0.85;
        phases[i] = rng() * Math.PI * 2;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const colorMap = {
        snow: '#ffffff',
        rain: '#7dd3fc',
        petals: '#fbcfe8',
        fireflies: '#fef08a',
        stars: '#e0f2fe',
        embers: '#fb923c'
      };
      const sizeMap = { snow: 0.22, rain: 0.14, petals: 0.28, fireflies: 0.3, stars: 0.24, embers: 0.26 };

      const additive = (type === 'fireflies' || type === 'stars' || type === 'embers');
      const mat = new THREE.PointsMaterial({
        color: new THREE.Color(colorMap[type] || '#ffffff'),
        size: sizeMap[type] || 0.22,
        transparent: true,
        opacity: additive ? 0.95 : 0.82,
        blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
        depthWrite: false
      });

      particleSystem = new THREE.Points(geo, mat);
      particleMeta = { type, count, speeds, phases };
      portalDynamicGroup.add(particleSystem);
    }

    // =========================================================================
    // 8. 双方向ポータル通過＆UI操作
    // =========================================================================
    function switchSpace(enterWorld) {
      if (state.inWorld === enterWorld) return;
      state.inWorld = enterWorld;
      state.portalCooldown = 0.65;
      playPortalChord(enterWorld);

      if (enterWorld) {
        homeScene.remove(doorGroup);
        portalScene.add(doorGroup);
        applyStencilTestToScene(portalScene, false);
        applyStencilTestToScene(homeScene, true);
        portalMaskFront.visible = false;
        portalMaskBack.visible = true;
      } else {
        portalScene.remove(doorGroup);
        homeScene.add(doorGroup);
        applyStencilTestToScene(homeScene, false);
        applyStencilTestToScene(portalScene, true);
        portalMaskFront.visible = true;
        portalMaskBack.visible = false;
      }
      updateHUD();
    }

    let toastTimer = null;
    function showToast(msg, icon = '✨') {
      const el = document.getElementById('toast-message');
      document.getElementById('toast-text').textContent = msg;
      document.getElementById('toast-icon').textContent = icon;
      el.classList.remove('toast-enter');
      el.classList.add('toast-active');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.remove('toast-active');
        el.classList.add('toast-enter');
      }, 3000);
    }

    function updateHUD() {
      const dot = document.getElementById('location-dot');
      const label = document.getElementById('location-label');
      const enterBtn = document.getElementById('btn-enter-exit');
      const enterText = document.getElementById('enter-exit-text');
      const enterIcon = document.getElementById('enter-exit-icon');
      const toggleDoorBtn = document.getElementById('btn-toggle-door');

      if (state.inWorld) {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-sky-400 shadow-[0_0_8px_rgba(56,189,248,0.9)]';
        label.textContent = state.currentWorldData?.title || '異空間';
        enterText.textContent = 'ドアをくぐって元の部屋に戻る';
        enterIcon.textContent = '🏠';
        enterBtn.disabled = false;
      } else {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.9)]';
        label.textContent = '白いギャラリー空間';
        enterText.textContent = 'ドアをくぐって中へ入る';
        enterIcon.textContent = '🚶';
        enterBtn.disabled = !state.doorOpen;
      }
      toggleDoorBtn.textContent = state.doorOpen ? 'ドアを閉める' : 'ドアを開ける';
    }

    function renderWorldInfoCard(world) {
      const card = document.getElementById('world-info-card');
      const badge = document.getElementById('world-mode-badge');
      const tagsEl = document.getElementById('world-tags');

      document.getElementById('world-title').textContent = world.title;
      document.getElementById('world-desc').textContent = world.description;

      if (world.isProceduralHash) {
        badge.textContent = 'ハッシュ自動合成';
        badge.className = 'text-[10px] font-semibold tracking-wide px-2 py-0.5 rounded-full bg-purple-500/35 text-purple-200 border border-purple-400/40';
      } else {
        badge.textContent = 'キーワード解析合成';
        badge.className = 'text-[10px] font-semibold tracking-wide px-2 py-0.5 rounded-full bg-sky-500/30 text-sky-200 border border-sky-400/35';
      }

      tagsEl.innerHTML = '';
      world.tags.forEach((t) => {
        const span = document.createElement('span');
        span.className = 'text-[10px] px-2 py-0.5 rounded-full bg-white/10 text-white/85 border border-white/15';
        span.textContent = `${t.category}: ${t.label}`;
        tagsEl.appendChild(span);
      });

      card.classList.remove('opacity-0', 'translate-y-[-8px]');
      card.classList.add('opacity-100', 'translate-y-0');
    }

    async function generateAndOpen(destinationText) {
      const query = (destinationText || '').trim();
      if (!query) {
        showToast('行きたい場所を入力するか、ランダムボタンを押してください', '✏️');
        return;
      }

      // ドアが開いている待機空間なら一瞬閉じてから新しい世界へ開く演出
      if (!state.inWorld && state.doorOpen) {
        state.doorOpen = false;
        state.targetDoorAngle = 0;
        playDoorSound(false);
        await new Promise((r) => setTimeout(r, 340));
      }

      const worldData = analyzePromptOffline(query);
      state.currentWorldData = worldData;
      buildPortalWorld(worldData);
      renderWorldInfoCard(worldData);

      // ドアを開く＋発光パルス
      state.doorOpen = true;
      state.targetDoorAngle = OPEN_ANGLE;
      state.glowPulse = 1.0;
      playDoorSound(true);
      playPortalChord(true);

      if (!state.inWorld && camera.position.z < 0.8) {
        startAutoWalk(new THREE.Vector3(0, EYE_HEIGHT, 4.8), 0, 0.02);
      }

      updateHUD();
      showToast(
        state.inWorld
          ? `空間が「${worldData.title}」へ変化しました`
          : `ドアの向こうに「${worldData.title}」が現れました！`,
        '✨'
      );
    }

    function generateRandomDestination() {
      const times = ['夕暮れの', 'オーロラの', '満天の星空と', '幻想的な霧の', '朝日の', 'ネオン輝く夜の', '深宇宙の'];
      const places = [
        '桜とお城', '雪山と針葉樹', '竹林と赤い鳥居', '東京タワーと摩天楼',
        '砂漠とピラミッド', '青い海とヤシの木', 'クリスタル古代遺跡', '火の粉舞う火山遺跡',
        '浮遊惑星とクリスタル', '蛍の舞う静かな森'
      ];
      const phrase = times[Math.floor(Math.random() * times.length)] + places[Math.floor(Math.random() * places.length)];
      document.getElementById('destination-input').value = phrase;
      generateAndOpen(phrase);
    }

    function startAutoWalk(targetPos, targetYaw, targetPitch) {
      state.autoWalk.active = true;
      state.autoWalk.targetPos.copy(targetPos);
      state.autoWalk.targetYaw = targetYaw;
      state.autoWalk.targetPitch = targetPitch;
    }

    function bindEvents() {
      document.getElementById('portal-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('destination-input');
        generateAndOpen(input.value);
        input.blur();
      });

      document.getElementById('btn-random').addEventListener('click', generateRandomDestination);

      document.querySelectorAll('.preset-chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          const prompt = chip.getAttribute('data-prompt');
          document.getElementById('destination-input').value = prompt;
          generateAndOpen(prompt);
        });
      });

      // ドアをくぐるボタン
      document.getElementById('btn-enter-exit').addEventListener('click', () => {
        if (!state.doorOpen) {
          state.doorOpen = true;
          state.targetDoorAngle = OPEN_ANGLE;
          playDoorSound(true);
          updateHUD();
        }
        if (!state.inWorld) {
          startAutoWalk(new THREE.Vector3(0, EYE_HEIGHT, -6.2), 0, 0.03);
        } else {
          startAutoWalk(new THREE.Vector3(0, EYE_HEIGHT, 5.2), 0, 0.02);
        }
      });

      // ドア開閉トグル
      document.getElementById('btn-toggle-door').addEventListener('click', () => {
        state.doorOpen = !state.doorOpen;
        state.targetDoorAngle = state.doorOpen ? OPEN_ANGLE : 0;
        if (!state.doorOpen) state.autoWalk.active = false;
        playDoorSound(state.doorOpen);
        if (state.doorOpen && state.currentWorldData) {
          renderWorldInfoCard(state.currentWorldData);
        }
        updateHUD();
      });

      // パネル折りたたみ
      document.getElementById('btn-toggle-panel').addEventListener('click', () => {
        state.panelCollapsed = !state.panelCollapsed;
        const panel = document.getElementById('control-panel');
        const chev = document.getElementById('toggle-chevron');
        const lbl = document.getElementById('toggle-label');
        panel.classList.toggle('hidden', state.panelCollapsed);
        chev.style.transform = state.panelCollapsed ? 'rotate(180deg)' : 'rotate(0deg)';
        lbl.textContent = state.panelCollapsed ? '操作パネルを開く' : 'UIを隠して3Dを広く見る';
      });

      // 効果音ミュート切替
      document.getElementById('btn-sound').addEventListener('click', () => {
        state.soundEnabled = !state.soundEnabled;
        document.getElementById('icon-sound-on').classList.toggle('hidden', !state.soundEnabled);
        document.getElementById('icon-sound-off').classList.toggle('hidden', state.soundEnabled);
        showToast(state.soundEnabled ? '効果音：オン' : '効果音：オフ', state.soundEnabled ? '🔊' : '🔇');
      });

      // 視点リセット
      document.getElementById('btn-reset-cam').addEventListener('click', () => {
        if (state.inWorld) {
          startAutoWalk(new THREE.Vector3(0, EYE_HEIGHT, -6.2), 0, 0.03);
        } else {
          startAutoWalk(new THREE.Vector3(0, EYE_HEIGHT, 5.2), 0, 0.02);
        }
      });

      bindMovementControls();
    }

    function bindMovementControls() {
      const canvas = renderer.domElement;
      const pad = document.getElementById('mobile-move-pad');
      const padToggle = document.getElementById('btn-toggle-pad');

      canvas.addEventListener('pointerdown', (event) => {
        if (event.button !== 0 || state.lookPointerId !== null) return;
        canvas.setPointerCapture(event.pointerId);
        state.lookPointerId = event.pointerId;
        state.lastPointerX = event.clientX;
        state.lastPointerY = event.clientY;
        state.autoWalk.active = false;
      });
      canvas.addEventListener('pointermove', (event) => {
        if (state.lookPointerId !== event.pointerId) return;
        state.yaw -= (event.clientX - state.lastPointerX) * 0.0042;
        state.pitch = THREE.MathUtils.clamp(
          state.pitch - (event.clientY - state.lastPointerY) * 0.0042,
          -Math.PI * 0.42, Math.PI * 0.42
        );
        state.lastPointerX = event.clientX;
        state.lastPointerY = event.clientY;
      });
      function stopLooking(event) {
        if (event.pointerId === state.lookPointerId) state.lookPointerId = null;
      }
      for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
        canvas.addEventListener(type, stopLooking);
      }

      window.addEventListener('keydown', (event) => {
        if (!movementKeys.has(event.code) || event.isComposing || event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.target instanceof HTMLElement && event.target.closest('input, textarea, select, [contenteditable]')) return;
        event.preventDefault();
        state.heldKeys.add(event.code);
        state.autoWalk.active = false;
      });
      window.addEventListener('keyup', (event) => state.heldKeys.delete(event.code));
      document.getElementById('destination-input').addEventListener('focus', () => state.heldKeys.clear());

      function stopPadPointer(id) {
        const button = state.padPointers.get(id);
        if (!button) return;
        state.padPointers.delete(id);
        if (![...state.padPointers.values()].includes(button)) button.classList.remove('is-held');
      }
      function clearPad() {
        for (const [id, button] of state.padPointers) {
          stopPadPointer(id);
          if (button.hasPointerCapture(id)) button.releasePointerCapture(id);
        }
      }
      for (const button of pad.querySelectorAll('[data-move]')) {
        button.addEventListener('pointerdown', (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          button.setPointerCapture(event.pointerId);
          state.padPointers.set(event.pointerId, button);
          button.classList.add('is-held');
          state.autoWalk.active = false;
        });
        for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
          button.addEventListener(type, (event) => stopPadPointer(event.pointerId));
        }
      }

      const isPadVisible = () => getComputedStyle(pad).display !== 'none';
      function syncPadVisibility() {
        const visible = isPadVisible();
        padToggle.setAttribute('aria-expanded', String(visible));
        if (!visible) clearPad();
      }
      padToggle.addEventListener('click', () => {
        const willShow = !isPadVisible();
        pad.style.display = willShow ? 'flex' : 'none';
        syncPadVisibility();
        showToast(willShow ? '移動パッドを表示しました' : '移動パッドを非表示にしました', '🕹️');
      });
      syncPadVisibility();
      window.addEventListener('resize', syncPadVisibility);

      function releaseControls() {
        state.heldKeys.clear();
        clearPad();
        const id = state.lookPointerId;
        state.lookPointerId = null;
        if (id !== null && canvas.hasPointerCapture(id)) canvas.releasePointerCapture(id);
      }
      window.addEventListener('blur', releaseControls);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) releaseControls();
      });
    }

    function onWindowResize() {
      const container = document.getElementById('canvas-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    // =========================================================================
    // 9. アニメーション＆ステンシルバッファ・マルチパス描画
    // =========================================================================
    function updateMovement(dt) {
      const prevZ = camera.position.z;

      if (state.autoWalk.active) {
        const target = state.autoWalk.targetPos;
        const crossing = state.inWorld ? target.z > 0 : target.z < 0;
        // 連続で「入る」「戻る」を押しても、通過判定が有効になるまで待つ。
        if (crossing && (state.portalCooldown > 0 || Math.abs(state.doorAngle) <= 0.55)) {
          state.portalCooldown = Math.max(0, state.portalCooldown - dt);
          return;
        }
        const waypoint = crossing && Math.abs(camera.position.x) > 0.35
          ? new THREE.Vector3(0, EYE_HEIGHT, state.inWorld ? -1.5 : 1.5)
          : target;

        const dir = new THREE.Vector3().subVectors(waypoint, camera.position);
        const dist = dir.length();
        const step = 5.4 * dt;

        if (dist <= step && waypoint === target) {
          camera.position.copy(target);
          state.autoWalk.active = false;
        } else {
          dir.normalize().multiplyScalar(Math.min(step, dist));
          camera.position.add(dir);
        }
        state.yaw += (state.autoWalk.targetYaw - state.yaw) * Math.min(1, dt * 4.5);
        state.pitch += (state.autoWalk.targetPitch - state.pitch) * Math.min(1, dt * 4.5);
      } else {
        const directions = new Set();
        for (const key of state.heldKeys) directions.add(movementKeys.get(key));
        for (const button of state.padPointers.values()) directions.add(button.dataset.move);
        const forward = Number(directions.has('forward')) - Number(directions.has('backward'));
        const right = Number(directions.has('right')) - Number(directions.has('left'));
        const scale = 5.4 * dt / Math.max(1, Math.hypot(forward, right));
        const sin = Math.sin(state.yaw);
        const cos = Math.cos(state.yaw);
        camera.position.x += (-sin * forward + cos * right) * scale;
        camera.position.z += (-cos * forward - sin * right) * scale;
      }

      const maxR = state.inWorld ? 46 : 22;
      const r = Math.hypot(camera.position.x, camera.position.z);
      if (r > maxR) {
        camera.position.x *= maxR / r;
        camera.position.z *= maxR / r;
      }
      camera.position.y = EYE_HEIGHT;
      camera.rotation.y = state.yaw;
      camera.rotation.x = state.pitch;

      // ドア通過判定（z = 0 を横幅内で跨いだとき）
      if (state.portalCooldown > 0) {
        state.portalCooldown -= dt;
      } else if (state.doorOpen && Math.abs(state.doorAngle) > 0.55) {
        if (Math.abs(camera.position.x) < DOOR_WIDTH * 0.52) {
          if (!state.inWorld && prevZ >= 0 && camera.position.z < 0) {
            switchSpace(true);
          } else if (state.inWorld && prevZ <= 0 && camera.position.z > 0) {
            switchSpace(false);
          }
        }
      }
    }

    function updateWorldAnimations(elapsed, dt) {
      // ドアの滑らかな開閉
      state.doorAngle += (state.targetDoorAngle - state.doorAngle) * Math.min(1, dt * 5.2);
      doorPivot.rotation.y = state.doorAngle;

      // 生成直後のドア枠発光パルス
      if (state.glowPulse > 0) {
        state.glowPulse = Math.max(0, state.glowPulse - dt * 0.9);
        doorGlowMesh.material.opacity = state.glowPulse * 0.85;
      }

      // 波打つ海面
      if (animatedWaterMesh) {
        const pos = animatedWaterMesh.geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const z = pos.getZ(i);
          pos.setY(i, Math.sin(x * 0.17 + elapsed * 1.4) * 0.18 + Math.cos(z * 0.21 + elapsed * 1.1) * 0.14);
        }
        pos.needsUpdate = true;
      }

      // オーロラ
      if (animatedAuroraMesh) {
        animatedAuroraMesh.material.uniforms.uTime.value = elapsed;
      }

      // 浮遊クリスタル
      animatedFloaters.forEach((f) => {
        f.position.y = f.userData.baseY + Math.sin(elapsed * f.userData.speed + f.userData.phase) * 0.45;
        f.rotation.y += dt * 0.5;
      });

      // 惑星自転
      animatedPlanets.forEach((p) => {
        p.rotation.y += p.userData.rotSpeed * dt;
      });

      // パーティクル
      if (particleSystem && particleMeta) {
        const pos = particleSystem.geometry.attributes.position;
        const { type, count, speeds, phases } = particleMeta;
        for (let i = 0; i < count; i++) {
          let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
          const sp = speeds[i], ph = phases[i];

          if (type === 'rain') {
            y -= 19.0 * sp * dt;
            if (y < 0) y = 23;
          } else if (type === 'snow') {
            y -= 1.6 * sp * dt;
            x += Math.sin(elapsed * 0.9 + ph) * 0.5 * dt;
            if (y < 0) y = 22;
          } else if (type === 'petals') {
            y -= 1.25 * sp * dt;
            x += Math.sin(elapsed * 1.4 + ph) * 1.1 * dt;
            z += Math.cos(elapsed * 1.1 + ph) * 0.6 * dt;
            if (y < 0) { y = 19; x = (Math.random() - 0.5) * 46; }
          } else if (type === 'embers') {
            y += 2.2 * sp * dt;
            x += Math.sin(elapsed * 2.0 + ph) * 0.7 * dt;
            if (y > 20) y = 0.2;
          } else if (type === 'fireflies') {
            y += Math.sin(elapsed * 1.4 + ph) * 0.45 * dt;
            x += Math.cos(elapsed * 0.7 + ph) * 0.35 * dt;
            if (y < 0.4) y = 0.4;
            if (y > 8.5) y = 8.5;
          } else if (type === 'stars') {
            y += Math.sin(elapsed * 0.6 + ph) * 0.18 * dt;
          }
          pos.setXYZ(i, x, y, z);
        }
        pos.needsUpdate = true;
      }
    }

    function renderPortal() {
      renderer.clear(true, true, true);

      if (!state.inWorld) {
        // 待機空間 → 前面マスクでステンシル=1 → 深度クリア → 異空間をドア枠内のみ描画
        renderer.render(homeScene, camera);
        renderer.render(maskScene, camera);
        renderer.clearDepth();
        renderer.render(portalScene, camera);
      } else {
        // 異空間 → 背面マスクでステンシル=1 → 深度クリア → 待機空間をドア枠内のみ描画
        renderer.render(portalScene, camera);
        renderer.render(maskScene, camera);
        renderer.clearDepth();
        renderer.render(homeScene, camera);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      updateMovement(dt);
      updateWorldAnimations(clock.elapsedTime, dt);
      renderPortal();
    }

    // =========================================================================
    // 10. 起動処理
    // =========================================================================
    window.onload = function () {
      initThree();
      bindEvents();
      updateHUD();
      animate();
      showToast('行きたい場所を入力してドアを開けてください', '🚪');
    };
  </script>
</body>
</html>
