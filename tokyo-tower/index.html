<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>TOKYO TOWER — 3Dデモ 決定版 (Cinematic Edition)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #04070e;
    font-family: 'Inter', 'Noto Sans JP', sans-serif;
    color: #f4f6fa;
  }
  #canvas-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .glass-panel {
    background: rgba(10, 14, 24, 0.66);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
  }
  .ui-btn {
    transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.06);
    color: #e5eaf3;
  }
  .ui-btn:hover {
    background: rgba(255, 255, 255, 0.14);
  }
  .ui-btn.active-landmark {
    background: linear-gradient(135deg, rgba(255, 118, 46, 0.92), rgba(232, 63, 37, 0.92));
    border-color: rgba(255, 205, 150, 0.85);
    color: #fff;
    box-shadow: 0 0 16px rgba(255, 110, 42, 0.45);
  }
  .ui-btn.active-diamond {
    background: linear-gradient(135deg, rgba(84, 176, 255, 0.9), rgba(188, 108, 255, 0.9), rgba(255, 128, 178, 0.9));
    border-color: rgba(255, 255, 255, 0.8);
    color: #fff;
    box-shadow: 0 0 16px rgba(176, 130, 255, 0.5);
  }
  .ui-btn.active-neon {
    background: linear-gradient(135deg, rgba(0, 224, 255, 0.9), rgba(236, 36, 176, 0.92));
    border-color: rgba(168, 248, 255, 0.85);
    color: #fff;
    box-shadow: 0 0 16px rgba(0, 224, 255, 0.45);
  }
  .ui-btn.active-light {
    background: rgba(248, 250, 252, 0.92);
    color: #0b101d;
    border-color: #fff;
    font-weight: 600;
  }
  .ui-btn.active-lightdown {
    background: linear-gradient(135deg, rgba(30, 41, 78, 0.95), rgba(15, 23, 46, 0.95));
    border-color: rgba(148, 185, 255, 0.75);
    color: #dbeafe;
    box-shadow: 0 0 16px rgba(100, 155, 255, 0.35);
  }
  /* 0〜24時グラデーションスライダー */
  input[type="range"].time-slider {
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 999px;
    background: linear-gradient(90deg, #0b132b 0%, #e78a52 24%, #4ea8de 50%, #e05a33 75%, #0c142e 100%);
    outline: none;
  }
  input[type="range"].time-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff7eb;
    border: 2px solid #f97316;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.55);
    cursor: pointer;
  }
  input[type="range"].time-slider::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff7eb;
    border: 2px solid #f97316;
    cursor: pointer;
  }
  .pulse-dot {
    width: 7px;
    height: 7px;
    border-radius: 9999px;
    display: inline-block;
    animation: pulseGlow 1.9s infinite ease-in-out;
  }
  @keyframes pulseGlow {
    0%, 100% { opacity: 0.45; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.25); }
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body>
<!-- 3Dキャンバス描画領域 -->
<div id="canvas-container"></div>

<!-- エラー表示用メッセージボックス（alert不使用） -->

<!-- 左上：タイトル＆ステータスHUD -->

    </div>
    <h1 class="text-sm sm:text-base font-bold tracking-wider text-white mt-0.5">

      <span id="hud-mode">ランドマーク</span>

<!-- 右上：0時ライトダウン演出ボタン -->
<div class="fixed top-3 right-3 sm:top-5 sm:right-5 z-20 flex items-center gap-2">
  <button id="btn-lightdown" class="glass-panel ui-btn rounded-full px-3.5 py-2 sm:px-4 sm:py-2.5 text-xs font-medium flex items-center gap-1.5 cursor-pointer">

<!-- 下部：折りたたみ可能なガラスモーフィズム・コントロールパネル -->
<footer class="fixed bottom-3 left-1/2 -translate-x-1/2 sm:bottom-4 z-20 w-[calc(100vw-20px)] max-w-3xl pointer-events-none">
  <div class="glass-panel rounded-2xl overflow-hidden pointer-events-auto">
    <!-- パネルヘッダー（折りたたみバー） -->
    <div class="flex items-center justify-between px-3.5 py-2 border-b border-white/10">
      <div class="flex items-center gap-2 text-[11px] text-slate-300 truncate">

    <!-- パネル本体 -->

        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar shrink-0">

          <button data-hour="13.0" class="time-quick ui-btn rounded-xl px-2.5 py-1.5 text-[11px] cursor-pointer shrink-0">昼</button>

<!-- Three.js ES Modules importmap -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ============================================================================
// ヘルパー関数・東京タワー形状定義
// ============================================================================

function showError(message) {
  const modal = document.getElementById('error-modal');
  const msg = document.getElementById('error-msg');
  if (modal && msg) {
    msg.textContent = message;
    modal.classList.remove('hidden');
  }
}

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function smoothstep(edge0, edge1, x) {
  const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
  return t * t * (3 - 2 * t);
}

/**
 * 東京タワーの断面半幅を高さ y (0〜66.6, 1u = 5m, 全高333m) から算出
 */
function getTowerHalfWidth(y) {
  if (y <= 30.0) {
    const t = y / 30.0;
    return 2.35 + 6.55 * Math.pow(1.0 - t, 2.15);
  } else if (y <= 50.0) {
    const t = (y - 30.0) / 20.0;
    return 0.92 + (2.35 - 0.92) * Math.pow(1.0 - t, 1.35);
  } else {
    const t = Math.min((y - 50.0) / 16.6, 1.0);
    return 0.12 + (0.92 - 0.12) * Math.pow(1.0 - t, 1.6);
  }
}

// インターナショナルオレンジ (#e83f25) と 白 (#f4f4f0) の紅白7段塗り分け
const COL_ORANGE = new THREE.Color(0xe83f25);
const COL_WHITE  = new THREE.Color(0xf4f4f0);

function getTowerBandColor(y) {
  if (y < 11.5) return COL_ORANGE;
  if (y < 21.0) return COL_WHITE;
  if (y < 30.5) return COL_ORANGE;
  if (y < 39.5) return COL_WHITE;
  if (y < 48.0) return COL_ORANGE;
  if (y < 55.0) return COL_WHITE;
  return COL_ORANGE;
}

/**
 * 東京ビル群の夜景窓テクスチャをプロシージャル生成
 */
function createCityWindowTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#04060b';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const cols = 16;
  const rows = 44;
  const cellW = canvas.width / cols;
  const cellH = canvas.height / rows;
  const palette = ['#ffe6b0', '#ffd085', '#dff0ff', '#fff7e4', '#a8d5ff'];

  for (let r = 1; r < rows - 1; r++) {
    const floorLit = 0.24 + Math.random() * 0.48;
    for (let c = 0; c < cols; c++) {
      if (Math.random() < floorLit) {
        ctx.fillStyle = palette[Math.floor(Math.random() * palette.length)];
        ctx.globalAlpha = 0.45 + Math.random() * 0.55;
        ctx.fillRect(c * cellW + 3, r * cellH + 4, cellW - 6, cellH - 8);
      }
    }
  }
  ctx.globalAlpha = 1.0;

  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ============================================================================
// メイン初期化
// ============================================================================
function initTokyoTowerCinematic() {
  try {
    const container = document.getElementById('canvas-container');

    // --- シーン・カメラ・レンダラー ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x070b18, 0.0038);

    const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.4, 950);
    camera.position.set(46, 26, 60);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;
    container.appendChild(renderer.domElement);

    // --- EffectComposer & UnrealBloomPass ---
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.85, // strength
      0.56, // radius
      0.28  // threshold
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    // --- OrbitControls ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.maxPolarAngle = Math.PI * 0.494;
    controls.minDistance = 8;
    controls.maxDistance = 185;
    controls.target.set(0, 26, 0);

    // --- アプリケーション状態 ---
    const state = {
      hour: 21.5,
      targetHour: 21.5,
      mode: 0,               // 0: ランドマーク, 1: ダイヤモンドヴェール, 2: ネオン・パルス
      targetMode: 0,
      weather: 'clear',      // 'clear' | 'rain' | 'snow' | 'fireworks'
      wetness: 0.32,
      targetWetness: 0.32,
      lightDown: false,
      lightDownProgress: 0,  // 0: 点灯, 1: 完全に下から上へ消灯完了
      windowPattern: 0,      // 0: ハート(♥), 1: 光ウェーブ
      camMode: 'cinematic',
      camTransition: null,
      cinematicTime: 0
    };

    // ユーザーがドラッグ・ピンチ操作を行ったら自由視点へ滑らかに移行
    controls.addEventListener('start', () => {
      if (state.camMode === 'cinematic' || state.camTransition) {
        state.camMode = 'free';
        state.camTransition = null;
        document.getElementById('hud-cam').textContent = '視点：自由操作';
        document.querySelectorAll('.cam-btn').forEach((b) => b.classList.remove('active-light'));
      }
    });

    // ========================================================================
    // 1. カスタムGLSLスカイドーム（0〜24時シームレス遷移＋満天の星空）
    // ========================================================================
    const skyUniforms = {
      uTime: { value: 0 },
      uSunDir: { value: new THREE.Vector3(0.5, -0.4, -0.5).normalize() },
      uZenithCol: { value: new THREE.Color(0x060b1c) },
      uMidCol: { value: new THREE.Color(0x0e1836) },
      uHorizonCol: { value: new THREE.Color(0x1b1a2d) },
      uStarAlpha: { value: 1.0 },
      uSunGlow: { value: 0.0 },
      uCityGlowCol: { value: new THREE.Color(0xff6b2b) },
      uCityGlowIntensity: { value: 0.45 }
    };

    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: skyUniforms,
      vertexShader: /* glsl */ `
        varying vec3 vDir;
        void main() {
          vDir = normalize(position);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */ `
        uniform float uTime;
        uniform vec3 uSunDir;
        uniform vec3 uZenithCol;
        uniform vec3 uMidCol;
        uniform vec3 uHorizonCol;
        uniform float uStarAlpha;
        uniform float uSunGlow;
        uniform vec3 uCityGlowCol;
        uniform float uCityGlowIntensity;
        varying vec3 vDir;

        float hash31(vec3 p) {
          p = fract(p * vec3(443.8975, 397.2973, 491.1871));
          p += dot(p, p.yxz + 19.19);
          return fract((p.x + p.y) * p.z);
        }

        void main() {
          vec3 dir = normalize(vDir);
          float h = clamp(dir.y, 0.0, 1.0);

          vec3 col = mix(uHorizonCol, uMidCol, smoothstep(0.0, 0.25, h));
          col = mix(col, uZenithCol, smoothstep(0.20, 0.82, h));

          // 太陽ディスク＆マジックアワー散乱
          float sunDot = max(dot(dir, normalize(uSunDir)), 0.0);
          vec3 sunTint = mix(vec3(1.0, 0.45, 0.18), vec3(1.0, 0.96, 0.88), clamp(uSunDir.y * 2.5, 0.0, 1.0));
          col += sunTint * (pow(sunDot, 7.0) * 0.45 + smoothstep(0.996, 0.9992, sunDot) * 2.2) * uSunGlow;

          // 東京の地平線ライトポリューション
          float cityGlow = exp(-h * 10.5);
          col += uCityGlowCol * cityGlow * uCityGlowIntensity;

          // 瞬く星々（0時ライトダウン時はさらに濃く輝く）
          if (uStarAlpha > 0.01 && dir.y > 0.02) {
            vec3 sg = floor(dir * 270.0);
            float r = hash31(sg);
            if (r > 0.9928) {
              float tw = 0.55 + 0.45 * sin(uTime * (2.0 + fract(r * 83.0) * 4.5) + r * 110.0);
              float vis = smoothstep(0.02, 0.34, dir.y) * uStarAlpha;
              vec3 sCol = mix(vec3(0.8, 0.9, 1.0), vec3(1.0, 0.92, 0.76), fract(r * 37.0));
              col += sCol * tw * vis * 1.3;
            }
          }

          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(460, 32, 24), skyMat));

    // ========================================================================
    // 2. ライティング
    // ========================================================================
    const hemiLight = new THREE.HemisphereLight(0x7e9ee0, 0x161422, 0.6);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xffcf9e, 1.0);
    sunLight.position.set(-60, 45, -45);
    scene.add(sunLight);

    // タワーを照らす内部ライトアップPointLight群（高さ別にライトダウン連動）
    const lightHeights = [8, 21, 35, 48, 59];
    const towerLights = lightHeights.map((lh) => {
      const pl = new THREE.PointLight(0xff7a2e, 26, 44, 1.45);
      pl.position.set(0, lh, 0);
      scene.add(pl);
      return { light: pl, y: lh };
    });

    // ========================================================================
    // 3. 東京タワー本体のプロシージャル3D造形（InstancedMesh）
    // ========================================================================
    const towerGroup = new THREE.Group();
    scene.add(towerGroup);

    const strutData = [];
    const upVec = new THREE.Vector3(0, 1, 0);

    function addStrut(p1, p2, radius, colorOverride = null) {
      const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
      const dir = new THREE.Vector3().subVectors(p2, p1);
      const len = dir.length();
      if (len < 0.001) return;
      const quat = new THREE.Quaternion().setFromUnitVectors(upVec, dir.clone().normalize());
      const col = colorOverride ? colorOverride.clone() : getTowerBandColor(mid.y).clone();
      strutData.push({ pos: mid, quat, scale: new THREE.Vector3(radius, len, radius), col });
    }

    // 高さレベル分割
    const levels = [];
    for (let i = 0; i <= 15; i++) levels.push((i / 15) * 30.0);
    for (let i = 1; i <= 12; i++) levels.push(30.0 + (i / 12) * 20.0);
    for (let i = 1; i <= 5; i++) levels.push(50.0 + (i / 5) * 7.5);

    const cornerSigns = [[-1, -1], [1, -1], [1, 1], [-1, 1]];

    for (let i = 0; i < levels.length - 1; i++) {
      const y0 = levels[i];
      const y1 = levels[i + 1];
      const w0 = getTowerHalfWidth(y0);
      const w1 = getTowerHalfWidth(y1);

      const mainR = y0 < 30 ? 0.24 - (y0 / 30) * 0.08 : (y0 < 50 ? 0.14 : 0.09);
      const braceR = mainR * 0.44;

      const c0 = cornerSigns.map(([sx, sz]) => new THREE.Vector3(sx * w0, y0, sz * w0));
      const c1 = cornerSigns.map(([sx, sz]) => new THREE.Vector3(sx * w1, y1, sz * w1));

      // 主柱と下部補強トラス
      for (let k = 0; k < 4; k++) {
        addStrut(c0[k], c1[k], mainR);
        if (y0 < 12.0) {
          const in0 = c0[k].clone().multiplyScalar(0.84); in0.y = y0;
          const in1 = c1[k].clone().multiplyScalar(0.84); in1.y = y1;
          addStrut(in0, in1, mainR * 0.52);
          addStrut(c0[k], in1, braceR * 0.85);
          addStrut(in0, c1[k], braceR * 0.85);
        }
      }

      // 4面の水平桁・X字トラス
      for (let k = 0; k < 4; k++) {
        const next = (k + 1) % 4;
        if (y0 >= 7.8) {
          addStrut(c1[k], c1[next], braceR * 1.15);
          const inDeck = (y0 >= 28.5 && y0 < 31.8) || (y0 >= 49.0 && y0 < 51.2);
          if (!inDeck) {
            addStrut(c0[k], c1[next], braceR);
            addStrut(c0[next], c1[k], braceR);
            if (y0 < 28.0) {
              const m0 = new THREE.Vector3().lerpVectors(c0[k], c0[next], 0.5);
              const m1 = new THREE.Vector3().lerpVectors(c1[k], c1[next], 0.5);
              addStrut(m0, m1, braceR * 0.72);
              addStrut(c0[k], m1, braceR * 0.65);
              addStrut(m0, c1[k], braceR * 0.65);
              addStrut(m0, c1[next], braceR * 0.65);
              addStrut(c0[next], m1, braceR * 0.65);
            }
          }
        }
      }
    }

    // 足元の優雅なアーチ（4面）
    const archSegs = 12;
    const archH = 7.4;
    for (let side = 0; side < 4; side++) {
      const next = (side + 1) % 4;
      const [sx0, sz0] = cornerSigns[side];
      const [sx1, sz1] = cornerSigns[next];
      let prevIn = null;
      let prevOut = null;

      for (let s = 0; s <= archSegs; s++) {
        const u = s / archSegs;
        const ay = Math.sin(u * Math.PI) * archH;
        const wAtY = getTowerHalfWidth(ay);
        const t = 0.14 + u * 0.72;
        const inPt = new THREE.Vector3(
          THREE.MathUtils.lerp(sx0, sx1, t) * wAtY,
          ay,
          THREE.MathUtils.lerp(sz0, sz1, t) * wAtY
        );
        const outY = Math.min(ay + 1.35, 8.2);
        const wOut = getTowerHalfWidth(outY);
        const outPt = new THREE.Vector3(
          THREE.MathUtils.lerp(sx0, sx1, t) * wOut,
          outY,
          THREE.MathUtils.lerp(sz0, sz1, t) * wOut
        );
        if (prevIn && prevOut) {
          addStrut(prevIn, inPt, 0.18, COL_ORANGE);
          addStrut(prevOut, outPt, 0.12, COL_ORANGE);
          addStrut(inPt, outPt, 0.09, COL_ORANGE);
          addStrut(prevIn, outPt, 0.08, COL_ORANGE);
        }
        prevIn = inPt;
        prevOut = outPt;
      }
    }

    // 鉄骨InstancedMesh
    const dummy = new THREE.Object3D();
    const strutMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.42,
      metalness: 0.56,
      emissive: new THREE.Color(0x2a0f05),
      emissiveIntensity: 0.45
    });
    const strutInst = new THREE.InstancedMesh(new THREE.CylinderGeometry(1, 1, 1, 6, 1), strutMat, strutData.length);
    strutData.forEach((d, idx) => {
      dummy.position.copy(d.pos);
      dummy.quaternion.copy(d.quat);
      dummy.scale.copy(d.scale);
      dummy.updateMatrix();
      strutInst.setMatrixAt(idx, dummy.matrix);
      strutInst.setColorAt(idx, d.col);
    });
    strutInst.instanceMatrix.needsUpdate = true;
    strutInst.instanceColor.needsUpdate = true;
    towerGroup.add(strutInst);

    // --- 3-2. フットタウン（タワー直下の低層建築＋エントランス照明） ---
    const footTown = new THREE.Group();
    const ftWallMat = new THREE.MeshStandardMaterial({ color: 0x1c2232, roughness: 0.62, metalness: 0.3 });
    const ftBase = new THREE.Mesh(new THREE.BoxGeometry(12.6, 3.4, 12.6), ftWallMat);
    ftBase.position.y = 1.7;
    footTown.add(ftBase);

    const ftRoof = new THREE.Mesh(
      new THREE.BoxGeometry(13.0, 0.35, 13.0),
      new THREE.MeshStandardMaterial({ color: 0x2a3348, roughness: 0.5 })
    );
    ftRoof.position.y = 3.55;
    footTown.add(ftRoof);

    // フットタウンの発光窓帯＆エントランスキャノピー
    const ftWinMat = new THREE.MeshStandardMaterial({
      color: 0xffe4b8,
      emissive: 0xffb357,
      emissiveIntensity: 1.4
    });
    [1.1, 2.35].forEach((wy) => {
      const strip = new THREE.Mesh(new THREE.BoxGeometry(12.75, 0.36, 12.75), ftWinMat);
      strip.position.y = wy;
      footTown.add(strip);
    });
    // 正面エントランス照明
    const canopy = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.18, 2.0), ftWallMat);
    canopy.position.set(0, 1.6, 7.1);
    footTown.add(canopy);
    const entGlow = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.14, 1.4), ftWinMat);
    entGlow.position.set(0, 1.48, 7.1);
    footTown.add(entGlow);
    towerGroup.add(footTown);

    // --- 3-3. シースルーエレベーターの光（フットタウン〜メインデッキ間を傾斜に沿って昇降） ---
    const elevSpecs = [
      { face: 0, offset: -0.55, speed: 0.095, phase: 0.0 },
      { face: 0, offset:  0.55, speed: 0.082, phase: 0.52 },
      { face: 1, offset:  0.0,  speed: 0.088, phase: 0.28 },
      { face: 2, offset:  0.0,  speed: 0.091, phase: 0.74 }
    ];
    const elevMat = new THREE.MeshBasicMaterial({ color: 0xfff0c8 });
    const elevGeo = new THREE.BoxGeometry(0.42, 0.95, 0.42);
    const elevators = elevSpecs.map((spec) => {
      const mesh = new THREE.Mesh(elevGeo, elevMat);
      towerGroup.add(mesh);
      return { ...spec, mesh };
    });

    // --- 3-4. メインデッキ（2層構造＋電光ウィンドウ「♥ハート / 光ウェーブ」） ---
    const mainDeck = new THREE.Group();
    mainDeck.position.y = 30.0;

    const deckBodyMat = new THREE.MeshStandardMaterial({
      color: 0xf1f3f7,
      roughness: 0.38,
      metalness: 0.45,
      emissive: 0x221814,
      emissiveIntensity: 0.3
    });
    const deckGlassMat = new THREE.MeshStandardMaterial({
      color: 0xfff0d4,
      emissive: 0xffba66,
      emissiveIntensity: 1.6,
      roughness: 0.15,
      metalness: 0.2
    });

    const mdLower = new THREE.Mesh(new THREE.BoxGeometry(6.5, 1.35, 6.5), deckBodyMat);
    mdLower.position.y = -0.68;
    mainDeck.add(mdLower);

    const mdWin1 = new THREE.Mesh(new THREE.BoxGeometry(6.62, 0.48, 6.62), deckGlassMat);
    mdWin1.position.y = -0.62;
    mainDeck.add(mdWin1);

    const mdUpper = new THREE.Mesh(new THREE.BoxGeometry(6.9, 1.45, 6.9), deckBodyMat);
    mdUpper.position.y = 0.74;
    mainDeck.add(mdUpper);

    // メインデッキ外周の電光ウィンドウ（カスタムGLSLドットマトリクス：♥ハート & 光ウェーブ）
    const deckWindowUniforms = {
      uTime: { value: 0 },
      uPattern: { value: 0.0 },     // 0: ♥ハート, 1: 光ウェーブ
      uIntensity: { value: 1.0 },
      uAccentCol: { value: new THREE.Color(0xff4d79) }
    };

    const deckDisplayMat = new THREE.ShaderMaterial({
      transparent: true,
      uniforms: deckWindowUniforms,
      vertexShader: /* glsl */ `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */ `
        uniform float uTime;
        uniform float uPattern;
        uniform float uIntensity;
        uniform vec3 uAccentCol;
        varying vec2 vUv;

        // 7x5 ドット絵風のハート（♥）マスク
        float heartDot(vec2 cell) {
          // cell.x: 0..15, cell.y: 0..6 (中央付近に配置)
          float cx = floor(cell.x) - 7.5;
          float cy = floor(cell.y) - 3.0;
          float ax = abs(cx);
          if (cy == 2.0 && (ax == 1.5 || ax == 2.5)) return 1.0;
          if (cy == 1.0 && ax <= 3.5) return 1.0;
          if (cy == 0.0 && ax <= 3.5) return 1.0;
          if (cy == -1.0 && ax <= 2.5) return 1.0;
          if (cy == -2.0 && ax <= 1.5) return 1.0;
          if (cy == -3.0 && ax <= 0.5) return 1.0;
          return 0.0;
        }

        void main() {
          vec2 grid = vec2(16.0, 7.0);
          vec2 uvGrid = vUv * grid;
          vec2 cell = floor(uvGrid);
          vec2 f = fract(uvGrid);

          // 丸いLEDドット形状
          float dotMask = smoothstep(0.46, 0.24, length(f - 0.5));

          // パターン0: ハートマーク（♥）が脈打ち、周囲に淡い枠光
          float heart = heartDot(cell);
          float pulse = 0.78 + 0.22 * sin(uTime * 3.4);
          vec3 baseBg = vec3(0.18, 0.14, 0.10) * 0.45;
          vec3 colHeart = mix(baseBg, vec3(1.0, 0.24, 0.46) * 2.1 * pulse, heart);

          // パターン1: 横へ流れる光のウェーブ
          float wave = 0.5 + 0.5 * sin(cell.x * 0.65 - uTime * 4.5 + sin(cell.y * 0.8));
          float wavePeak = smoothstep(0.45, 0.95, wave);
          vec3 colWave = mix(vec3(0.15, 0.22, 0.35), uAccentCol * 2.1, wavePeak);

          vec3 finalCol = mix(colHeart, colWave, uPattern) * dotMask * uIntensity;
          float alpha = clamp((0.35 + 0.65 * max(heart * (1.0 - uPattern), wavePeak * uPattern)) * uIntensity, 0.08, 0.96);
          gl_FragColor = vec4(finalCol, alpha);
        }
      `
    });

    // メインデッキ4面に電光ウィンドウパネルを配置
    const displayGeo = new THREE.PlaneGeometry(6.3, 0.95);
    [
      [0, 0.74,  3.48, 0],
      [0, 0.74, -3.48, Math.PI],
      [ 3.48, 0.74, 0, Math.PI / 2],
      [-3.48, 0.74, 0, -Math.PI / 2]
    ].forEach(([px, py, pz, ry]) => {
      const panel = new THREE.Mesh(displayGeo, deckDisplayMat);
      panel.position.set(px, py, pz);
      panel.rotation.y = ry;
      mainDeck.add(panel);
    });

    // リムリング
    const deckRimMat = new THREE.MeshBasicMaterial({ color: 0xff9a44 });
    const mdRimTop = new THREE.Mesh(new THREE.BoxGeometry(7.12, 0.14, 7.12), deckRimMat);
    mdRimTop.position.y = 1.48;
    const mdRimBot = new THREE.Mesh(new THREE.BoxGeometry(6.7, 0.14, 6.7), deckRimMat);
    mdRimBot.position.y = -1.36;
    mainDeck.add(mdRimTop, mdRimBot);
    towerGroup.add(mainDeck);

    // --- 3-5. トップデッキ（250m） ---
    const topDeck = new THREE.Group();
    topDeck.position.y = 50.0;
    topDeck.add(new THREE.Mesh(new THREE.BoxGeometry(3.25, 1.72, 3.25), deckBodyMat));
    const tdWin = new THREE.Mesh(new THREE.BoxGeometry(3.38, 0.74, 3.38), deckGlassMat);
    tdWin.position.y = 0.08;
    topDeck.add(tdWin);
    const tdRim = new THREE.Mesh(new THREE.BoxGeometry(3.48, 0.12, 3.48), deckRimMat);
    tdRim.position.y = 0.92;
    topDeck.add(tdRim);
    towerGroup.add(topDeck);

    // --- 3-6. 最上部アンテナ＆点滅する航空障害灯 ---
    const antMatW = new THREE.MeshStandardMaterial({ color: 0xf4f4f0, roughness: 0.35, metalness: 0.65 });
    const antMatO = new THREE.MeshStandardMaterial({ color: 0xe83f25, roughness: 0.35, metalness: 0.65 });
    [
      { y0: 57.5, y1: 60.5, r0: 0.34, r1: 0.26, mat: antMatO },
      { y0: 60.5, y1: 63.5, r0: 0.26, r1: 0.16, mat: antMatW },
      { y0: 63.5, y1: 66.6, r0: 0.14, r1: 0.05, mat: antMatO }
    ].forEach((s) => {
      const h = s.y1 - s.y0;
      const m = new THREE.Mesh(new THREE.CylinderGeometry(s.r1, s.r0, h, 10), s.mat);
      m.position.y = s.y0 + h * 0.5;
      towerGroup.add(m);
    });
    [59.0, 61.5, 63.8].forEach((ry, idx) => {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.62 - idx * 0.14, 0.055, 8, 20), antMatW);
      ring.rotation.x = Math.PI / 2;
      ring.position.y = ry;
      towerGroup.add(ring);
    });

    const beaconMat = new THREE.MeshBasicMaterial({ color: 0xff1e1e });
    const beaconTop = new THREE.Mesh(new THREE.SphereGeometry(0.26, 12, 12), beaconMat);
    beaconTop.position.y = 66.85;
    towerGroup.add(beaconTop);
    [[0.95, 50.9, 0.95], [-0.95, 50.9, -0.95], [3.35, 31.5, 3.35], [-3.35, 31.5, -3.35]].forEach(([bx, by, bz]) => {
      const bm = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), beaconMat);
      bm.position.set(bx, by, bz);
      towerGroup.add(bm);
    });
    const beaconLight = new THREE.PointLight(0xff2020, 14, 20);
    beaconLight.position.y = 66.85;
    towerGroup.add(beaconLight);

    // ========================================================================
    // 4. 光エネルギー・シース＆LEDノード（0時ライトダウン対応）
    // ========================================================================
    const sheathProfile = [];
    for (let i = 0; i <= 48; i++) {
      const y = (i / 48) * 65.0;
      sheathProfile.push(new THREE.Vector2(getTowerHalfWidth(y) * 1.46, y));
    }
    const sheathGeo = new THREE.LatheGeometry(sheathProfile, 4);
    sheathGeo.rotateY(Math.PI / 4);

    const pulseUniforms = {
      uTime: { value: 0 },
      uMode: { value: 0.0 },
      uLightLevel: { value: 1.0 },
      uCutoffY: { value: -5.0 } // ライトダウン時に下から上へ消灯する高さ閾値
    };

    const sheathMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      uniforms: pulseUniforms,
      vertexShader: /* glsl */ `
        varying vec3 vPos;
        void main() {
          vPos = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */ `
        uniform float uTime;
        uniform float uMode;
        uniform float uLightLevel;
        uniform float uCutoffY;
        varying vec3 vPos;

        vec3 hsv2rgb(vec3 c) {
          vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
          vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
          return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
        }

        void main() {
          // ライトダウン：uCutoffY より下の領域を滑らかに消灯
          float lightMask = smoothstep(uCutoffY - 2.0, uCutoffY + 3.5, vPos.y) * uLightLevel;
          if (lightMask < 0.005) discard;

          float h = clamp(vPos.y / 65.0, 0.0, 1.0);
          float wave1 = smoothstep(0.08, 0.0, abs(fract(h * 1.3 - uTime * 0.24) - 0.5));
          float wave2 = smoothstep(0.05, 0.0, abs(fract(h * 2.5 - uTime * 0.42 + 0.35) - 0.5));
          float scan = 0.5 + 0.5 * sin(vPos.y * 4.2 - uTime * 5.0);

          vec3 col0 = mix(vec3(1.0, 0.38, 0.08), vec3(1.0, 0.80, 0.36), wave1);
          float alpha0 = (wave1 * 0.36 + wave2 * 0.16) * (0.65 + 0.35 * scan);

          float layerIdx = floor(h * 7.0) / 7.0;
          vec3 col1 = hsv2rgb(vec3(fract(layerIdx + uTime * 0.14), 0.86, 1.0));
          float sparkle = pow(0.5 + 0.5 * sin(vPos.y * 9.0 + vPos.x * 5.0 + uTime * 6.0), 4.0);
          float alpha1 = 0.15 + wave1 * 0.40 + sparkle * 0.36;

          float cyber = 0.5 + 0.5 * sin(h * 10.0 - uTime * 3.2);
          vec3 col2 = mix(vec3(0.0, 0.92, 1.0), vec3(1.0, 0.12, 0.72), cyber);
          float gridLine = smoothstep(0.88, 0.99, sin(vPos.y * 3.2 - uTime * 6.5));
          float alpha2 = wave1 * 0.50 + wave2 * 0.30 + gridLine * 0.36;

          vec3 col = col0;
          float alpha = alpha0;
          if (uMode < 1.0) {
            col = mix(col0, col1, uMode);
            alpha = mix(alpha0, alpha1, uMode);
          } else {
            col = mix(col1, col2, uMode - 1.0);
            alpha = mix(alpha1, alpha2, uMode - 1.0);
          }

          float edgeFade = smoothstep(0.0, 0.07, h) * smoothstep(1.0, 0.93, h);
          gl_FragColor = vec4(col, alpha * edgeFade * lightMask);
        }
      `
    });
    towerGroup.add(new THREE.Mesh(sheathGeo, sheathMat));

    // LEDノード（InstancedMesh）
    const ledNodes = [];
    for (let i = 1; i < levels.length - 1; i++) {
      const y = levels[i];
      if (y < 4.5 || y > 57.0) continue;
      const w = getTowerHalfWidth(y) * 1.03;
      cornerSigns.forEach(([sx, sz], ci) => {
        ledNodes.push({
          pos: new THREE.Vector3(sx * w, y, sz * w),
          y,
          yNorm: y / 57.0,
          phase: i * 0.55 + ci * 1.57
        });
      });
    }
    const ledInst = new THREE.InstancedMesh(
      new THREE.SphereGeometry(0.18, 6, 6),
      new THREE.MeshBasicMaterial({ color: 0xffffff }),
      ledNodes.length
    );
    ledNodes.forEach((n, i) => {
      dummy.position.copy(n.pos);
      dummy.quaternion.identity();
      dummy.scale.setScalar(1);
      dummy.updateMatrix();
      ledInst.setMatrixAt(i, dummy.matrix);
      ledInst.setColorAt(i, new THREE.Color(0xff9944));
    });
    ledInst.instanceMatrix.needsUpdate = true;
    ledInst.instanceColor.needsUpdate = true;
    towerGroup.add(ledInst);

    // ========================================================================
    // 5. 濡れた路面の反射シェーダー（Wet Asphalt Shader）
    // ========================================================================
    const wetUniforms = {
      uTime: { value: 0 },
      uWetness: { value: 0.32 },
      uTowerColor: { value: new THREE.Color(0xff7728) },
      uTowerIntensity: { value: 1.0 },
      uDayFactor: { value: 0.0 }
    };

    const groundMat = new THREE.ShaderMaterial({
      uniforms: wetUniforms,
      vertexShader: /* glsl */ `
        varying vec3 vWorldPos;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: /* glsl */ `
        uniform float uTime;
        uniform float uWetness;
        uniform vec3 uTowerColor;
        uniform float uTowerIntensity;
        uniform float uDayFactor;
        varying vec3 vWorldPos;

        float hash21(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }
        float vnoise(vec2 p) {
          vec2 i = floor(p), f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),
            mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x),
            f.y
          );
        }

        void main() {
          vec2 xz = vWorldPos.xz;
          float dist = length(xz);

          // アスファルトの基本色（昼と夜で変化）
          float grain = vnoise(xz * 1.4) * 0.5 + vnoise(xz * 4.5) * 0.5;
          vec3 nightAsphalt = vec3(0.025, 0.032, 0.052) * (0.75 + 0.5 * grain);
          vec3 dayAsphalt   = vec3(0.18, 0.20, 0.23) * (0.85 + 0.3 * grain);
          vec3 baseCol = mix(nightAsphalt, dayAsphalt, uDayFactor);

          // 水たまりマスク（小雨モードで広がる）
          float puddleNoise = vnoise(xz * 0.09 + 2.5) * 0.65 + vnoise(xz * 0.23) * 0.35;
          float puddle = smoothstep(0.66 - uWetness * 0.38, 0.86 - uWetness * 0.28, puddleNoise);

          // 雨粒の波紋（濡れ度が高いときのみ）
          float ripple = 0.0;
          if (uWetness > 0.55) {
            float rp = sin(length(fract(xz * 0.35) - 0.5) * 28.0 - uTime * 8.0);
            ripple = rp * 0.06 * puddle * (uWetness - 0.55);
          }

          // カメラ視線とタワー方向に基づく濡れ路面の反射ストリーク
          vec3 viewDir = normalize(cameraPosition - vWorldPos);
          float fresnel = pow(1.0 - max(viewDir.y, 0.0), 3.0);

          vec2 toTower = normalize(-xz + vec2(0.0001));
          vec2 viewHoriz = normalize(vec2(viewDir.x, viewDir.z) + vec2(0.0001));
          // タワーとカメラを結ぶ線上に伸びる縦長の反射光
          float align = max(dot(-viewHoriz, toTower), 0.0);
          float streak = pow(align, 6.0) * exp(-dist * 0.015);
          float baseGlow = exp(-dist * 0.042);

          float reflStrength = (0.16 + uWetness * 0.85) * (0.35 + 0.65 * puddle + ripple);
          vec3 towerRefl = uTowerColor * (streak * 1.25 + baseGlow * 0.55) * reflStrength * uTowerIntensity;

          // 周囲の東京都市光の淡い反射
          vec3 cityRefl = vec3(0.14, 0.18, 0.30) * fresnel * puddle * (0.25 + uWetness * 0.65) * (1.0 - uDayFactor * 0.65);

          // 芝公園の円形芝生エリア（足元周り）
          float parkRing = smoothstep(13.5, 16.5, dist) * (1.0 - smoothstep(21.0, 24.5, dist));
          vec3 parkCol = mix(vec3(0.025, 0.055, 0.035), vec3(0.16, 0.30, 0.14), uDayFactor);
          baseCol = mix(baseCol, parkCol, parkRing * 0.65);

          // 遠景フォグへの自然なフェード
          float farFade = 1.0 - smoothstep(195.0, 275.0, dist);
          vec3 col = (baseCol + towerRefl + cityRefl) * farFade + nightAsphalt * (1.0 - farFade);
          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    const ground = new THREE.Mesh(new THREE.CircleGeometry(285, 72), groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // 足元の間接光リング
    const plazaRing = new THREE.Mesh(
      new THREE.RingGeometry(12.2, 12.65, 56),

    // ========================================================================
    // 6. 首都高カーブ（都心環状線C1風の高架道路＋流れる車の光跡）
    // ========================================================================
    const expresswayPts = [
      new THREE.Vector3(-120, 4.2,  52),
      new THREE.Vector3(-42,  4.4,  34),
      new THREE.Vector3( 14,  4.5,  26),
      new THREE.Vector3( 31,  4.6,   4),
      new THREE.Vector3( 36,  4.5, -36),
      new THREE.Vector3( 52,  4.3, -95),
      new THREE.Vector3( 85,  4.2, -145)
    ];
    const expresswayCurve = new THREE.CatmullRomCurve3(expresswayPts);

    // 高架道路の路面メッシュを曲線からプロシージャル生成
    const roadSegs = 90;
    const roadHalfW = 2.6;
    const roadVerts = [];
    const roadIndices = [];
    const roadCenters = [];

    for (let i = 0; i <= roadSegs; i++) {
      const u = i / roadSegs;
      const pt = expresswayCurve.getPointAt(u);
      const tan = expresswayCurve.getTangentAt(u).normalize();
      const side = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
      roadCenters.push({ pt, tan, side });

      const left = pt.clone().addScaledVector(side, -roadHalfW);
      const right = pt.clone().addScaledVector(side, roadHalfW);
      roadVerts.push(left.x, left.y, left.z, right.x, right.y, right.z);

      if (i < roadSegs) {
        const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
        roadIndices.push(a, b, c, b, d, c);
      }
    }

    const roadGeo = new THREE.BufferGeometry();
    roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadVerts, 3));
    roadGeo.setIndex(roadIndices);
    roadGeo.computeVertexNormals();
    const roadMesh = new THREE.Mesh(
      roadGeo,
      new THREE.MeshStandardMaterial({ color: 0x161b28, roughness: 0.75, side: THREE.DoubleSide })
    );

    // 首都高の高架橋脚＆ガードレール発光ライン
    const pierMat = new THREE.MeshStandardMaterial({ color: 0x222938, roughness: 0.85 });
    const pierGeo = new THREE.BoxGeometry(1.1, 4.6, 1.1);
    const pierCount = 16;
    const pierInst = new THREE.InstancedMesh(pierGeo, pierMat, pierCount);
    for (let i = 0; i < pierCount; i++) {
      const idx = Math.floor(((i + 0.5) / pierCount) * roadSegs);
      const { pt } = roadCenters[idx];
      dummy.position.set(pt.x, pt.y * 0.5, pt.z);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      pierInst.setMatrixAt(i, dummy.matrix);
    }
    pierInst.instanceMatrix.needsUpdate = true;
    scene.add(pierInst);

    // 首都高を流れる車のライト（上り・下り2車線、ヘッドライト白〜淡黄＆テールライト赤）
    const hwyCarCount = 96;
    const hwyCars = [];
    for (let i = 0; i < hwyCarCount; i++) {
      const dir = i % 2 === 0 ? 1 : -1;
      const laneOffset = dir * 1.15;
      const isHeadlight = Math.random() < 0.5;
      hwyCars.push({
        u: Math.random(),

      });
    }
    const hwyCarInst = new THREE.InstancedMesh(
      new THREE.BoxGeometry(0.28, 0.16, 1.0),
      new THREE.MeshBasicMaterial({ color: 0xffffff }),

    // ========================================================================
    // 7. 周囲の東京夜景ビル群（InstancedMesh・芝公園と首都高を回避）
    // ========================================================================
    const cityWindowTex = createCityWindowTexture();
    const buildingMat = new THREE.MeshStandardMaterial({
      color: 0x131a2c,

    const bldgMax = 360;
    const bldgInst = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), buildingMat, bldgMax);
    const roofBeacons = [];

    // 首都高との距離チェック用サンプル点
    const hwySamples = [];
    for (let i = 0; i <= 40; i++) hwySamples.push(expresswayCurve.getPointAt(i / 40));

    let bIdx = 0;
    let attempts = 0;
    while (bIdx < bldgMax && attempts < 2400) {
      attempts++;
      const ang = Math.random() * Math.PI * 2;
      const dist = 25.0 + Math.pow(Math.random(), 0.88) * 145.0;
      const bx = Math.cos(ang) * dist;
      const bz = Math.sin(ang) * dist;

      // 首都高カーブ付近は避ける
      let nearHwy = false;
      for (let s = 0; s < hwySamples.length; s++) {
        if (Math.hypot(bx - hwySamples[s].x, bz - hwySamples[s].z) < 9.5) {
          nearHwy = true;
          break;
        }
      }
      if (nearHwy) continue;

      const bw = 3.4 + Math.random() * 6.5;
      const bd = 3.4 + Math.random() * 6.5;
      const tall = Math.random() > 0.87;
      const bh = tall ? 17.0 + Math.random() * 21.0 : 3.8 + Math.random() * 11.5;

      dummy.position.set(bx, bh * 0.5, bz);
      dummy.quaternion.identity();
      dummy.scale.set(bw, bh, bd);
      dummy.updateMatrix();
      bldgInst.setMatrixAt(bIdx, dummy.matrix);

      const tint = new THREE.Color().setHSL(0.58 + (Math.random() - 0.5) * 0.14, 0.22, 0.65 + Math.random() * 0.35);
      bldgInst.setColorAt(bIdx, tint);

      if (bh > 20.0 && roofBeacons.length < 30) {
        roofBeacons.push(new THREE.Vector3(bx, bh + 0.35, bz));
      }
      bIdx++;
    }
    bldgInst.count = bIdx;
    bldgInst.instanceMatrix.needsUpdate = true;
    bldgInst.instanceColor.needsUpdate = true;
    scene.add(bldgInst);

    const roofBeaconInst = new THREE.InstancedMesh(
      new THREE.SphereGeometry(0.24, 6, 6),
      beaconMat,
      roofBeacons.length
    );
    roofBeacons.forEach((p, idx) => {
      dummy.position.copy(p);
      dummy.quaternion.identity();
      dummy.scale.setScalar(1);
      dummy.updateMatrix();
      roofBeaconInst.setMatrixAt(idx, dummy.matrix);
    });
    roofBeaconInst.instanceMatrix.needsUpdate = true;
    scene.add(roofBeaconInst);

    // ========================================================================
    // 8. 天候＆イベント演出（小雨・雪・東京湾方面の花火）
    // ========================================================================
    // --- 8-1. 小雨パーティクル ---
    const rainCount = 700;
    const rainPositions = new Float32Array(rainCount * 6);
    const rainDrops = [];
    for (let i = 0; i < rainCount; i++) {
      const rx = (Math.random() - 0.5) * 110;
      const ry = Math.random() * 80;
      const rz = (Math.random() - 0.5) * 110;
      const spd = 42 + Math.random() * 22;
      rainDrops.push({ x: rx, y: ry, z: rz, spd });
    }
    const rainGeo = new THREE.BufferGeometry();
    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
    const rainLines = new THREE.LineSegments(
      rainGeo,
      new THREE.LineBasicMaterial({ color: 0xaad4ff, transparent: true, opacity: 0.42 })
    );
    rainLines.visible = false;
    scene.add(rainLines);

    // --- 8-2. 雪パーティクル ---
    const snowCount = 650;
    const snowPositions = new Float32Array(snowCount * 3);
    const snowMeta = [];
    for (let i = 0; i < snowCount; i++) {
      const sx = (Math.random() - 0.5) * 120;
      const sy = Math.random() * 82;
      const sz = (Math.random() - 0.5) * 120;
      snowPositions[i * 3] = sx;
      snowPositions[i * 3 + 1] = sy;
      snowPositions[i * 3 + 2] = sz;
      snowMeta.push({ spd: 3.0 + Math.random() * 3.0, phase: Math.random() * 6.28 });
    }
    const snowGeo = new THREE.BufferGeometry();
    snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPositions, 3));
    const snowMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      uniforms: { uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) } },
      vertexShader: /* glsl */ `
        uniform float uPixelRatio;
        void main() {
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = (24.0 * uPixelRatio) / max(-mv.z, 1.0);
        }
      `,
      fragmentShader: /* glsl */ `
        void main() {
          float d = length(gl_PointCoord - 0.5);
          if (d > 0.5) discard;
          float a = smoothstep(0.5, 0.1, d) * 0.85;
          gl_FragColor = vec4(0.95, 0.97, 1.0, a);
        }
      `
    });
    const snowPoints = new THREE.Points(snowGeo, snowMat);
    snowPoints.visible = false;
    scene.add(snowPoints);

    // --- 8-3. 東京湾方面のパーティクル花火（プール方式・GCゼロ） ---
    const fwPoolSize = 4;
    const fwSparksPerBurst = 90;
    const fwTotal = fwPoolSize * fwSparksPerBurst;
    const fwPos = new Float32Array(fwTotal * 3);
    const fwCol = new Float32Array(fwTotal * 3);
    const fwGeo = new THREE.BufferGeometry();
    fwGeo.setAttribute('position', new THREE.BufferAttribute(fwPos, 3));
    fwGeo.setAttribute('color', new THREE.BufferAttribute(fwCol, 3));

    const fwMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexColors: true,
      uniforms: { uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) } },
      vertexShader: /* glsl */ `
        uniform float uPixelRatio;
        varying vec3 vCol;
        void main() {
          vCol = color;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = (46.0 * uPixelRatio) / max(-mv.z, 1.0);
        }
      `,
      fragmentShader: /* glsl */ `
        varying vec3 vCol;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          if (d > 0.5) discard;
          float g = pow(1.0 - d * 2.0, 2.0);
          gl_FragColor = vec4(vCol * 1.6, g);
        }
      `
    });
    const fireworksPoints = new THREE.Points(fwGeo, fwMat);
    fireworksPoints.visible = false;
    scene.add(fireworksPoints);

    const fwColors = [
      new THREE.Color(0xff5a7e), new THREE.Color(0xffcc44),
      new THREE.Color(0x44e6ff), new THREE.Color(0xc466ff),
      new THREE.Color(0x5eff9e)
    ];

    const fwBursts = [];
    function resetBurst(b, delay = 0) {
      b.age = -delay;
      b.launchDur = 1.05;
      b.burstDur = 2.1;
      // 東京湾方面（東〜南東の遠景）
      b.origin.set(42 + Math.random() * 44, 0, -32 - Math.random() * 42);
      b.peakY = 38 + Math.random() * 24;
      b.baseCol = fwColors[Math.floor(Math.random() * fwColors.length)];
      b.subCol  = fwColors[Math.floor(Math.random() * fwColors.length)];
      for (let k = 0; k < fwSparksPerBurst; k++) {
        // 球面上に均一分布する初速
        const u = Math.random() * 2 - 1;
        const th = Math.random() * Math.PI * 2;
        const r = Math.sqrt(1 - u * u);
        const spd = 9.0 + Math.random() * 9.5;
        b.vels[k].set(r * Math.cos(th) * spd, u * spd, r * Math.sin(th) * spd);
      }
    }

    for (let i = 0; i < fwPoolSize; i++) {
      const vels = Array.from({ length: fwSparksPerBurst }, () => new THREE.Vector3());
      const burst = { age: 0, launchDur: 1, burstDur: 2, origin: new THREE.Vector3(), peakY: 45, baseCol: fwColors[0], subCol: fwColors[1], vels };
      resetBurst(burst, i * 0.75);
      fwBursts.push(burst);
    }

      { h: 6.2,  zen: 0x26548c, mid: 0x7b6a88, hor: 0xf4945e, fog: 0x7a5b5c, sunI: 1.45, hemiI: 0.75, star: 0.05, night: 0.25, bloom: 0.52 },
      { h: 9.0,  zen: 0x1d68c2, mid: 0x5ca4e2, hor: 0xb6ddf5, fog: 0x9ec9e6, sunI: 2.20, hemiI: 1.05, star: 0.0,  night: 0.0, bloom: 0.20 },
      { h: 15.8, zen: 0x216bc2, mid: 0x62a4df, hor: 0xc2dceb, fog: 0xa4c8de, sunI: 2.05, hemiI: 1.00, star: 0.0,  night: 0.0, bloom: 0.22 },
      { h: 17.8, zen: 0x1e2658, mid: 0x6b2f58, hor: 0xf06534, fog: 0x4a2335, sunI: 1.30, hemiI: 0.68, star: 0.14, night: 0.65, bloom: 0.66 },

    // パネル折りたたみ
    const btnCollapse = document.getElementById('btn-collapse');
    const panelBody = document.getElementById('panel-body');
    const collapseLabel = document.getElementById('collapse-label');
    const collapseIcon = document.getElementById('collapse-icon');
    let isCollapsed = false;
    btnCollapse.addEventListener('click', () => {
      isCollapsed = !isCollapsed;
      panelBody.classList.toggle('hidden', isCollapsed);
      collapseLabel.textContent = isCollapsed ? '開く' : '閉じる';
      collapseIcon.style.transform = isCollapsed ? 'rotate(180deg)' : 'rotate(0deg)';
    });

    // ========================================================================
    // 11. メインアニメーションループ
    // ========================================================================
    const clock = new THREE.Clock();
    const tmpCol = new THREE.Color();
    const tmpCamPos = new THREE.Vector3();
    const tmpTarget = new THREE.Vector3();
    const colOrange = new THREE.Color(0xff7728);
    const colCyan   = new THREE.Color(0x00eaff);
    const colMag    = new THREE.Color(0xff1eb8);
    const colOff    = new THREE.Color(0x161922);

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;

      // 各種パラメータの滑らかな補間
      state.hour += (state.targetHour - state.hour) * Math.min(dt * 4.5, 1.0);
      state.mode += (state.targetMode - state.mode) * Math.min(dt * 3.5, 1.0);
      state.wetness += (state.targetWetness - state.wetness) * Math.min(dt * 2.0, 1.0);
      const targetLD = state.lightDown ? 1.0 : 0.0;
      state.lightDownProgress += (targetLD - state.lightDownProgress) * Math.min(dt * 1.45, 1.0);
      if (Math.abs(targetLD - state.lightDownProgress) < 0.002) state.lightDownProgress = targetLD;

      // 電光ウィンドウパターン補間
      deckWindowUniforms.uTime.value = t;
      deckWindowUniforms.uPattern.value += (state.windowPattern - deckWindowUniforms.uPattern.value) * Math.min(dt * 4.0, 1.0);

      // --- 0〜24時の空・環境光・自動点灯計算 ---
      const h = ((state.hour % 24) + 24) % 24;
      let k0 = envKeys[0], k1 = envKeys[envKeys.length - 1];
      for (let i = 0; i < envKeys.length - 1; i++) {
        if (h >= envKeys[i].h && h <= envKeys[i + 1].h) {
          k0 = envKeys[i];
          k1 = envKeys[i + 1];
          break;
        }
      }
      const kt = clamp((h - k0.h) / Math.max(k1.h - k0.h, 0.001), 0, 1);

      skyUniforms.uTime.value = t;
      skyUniforms.uZenithCol.value.copy(cA.setHex(k0.zen)).lerp(cB.setHex(k1.zen), kt);
      skyUniforms.uMidCol.value.copy(cA.setHex(k0.mid)).lerp(cB.setHex(k1.mid), kt);
      skyUniforms.uHorizonCol.value.copy(cA.setHex(k0.hor)).lerp(cB.setHex(k1.hor), kt);
      scene.fog.color.copy(cA.setHex(k0.fog)).lerp(cB.setHex(k1.fog), kt);

      const nightLevel = THREE.MathUtils.lerp(k0.night, k1.night, kt);
      const dayFactor = 1.0 - nightLevel;
      const baseStar = THREE.MathUtils.lerp(k0.star, k1.star, kt);
      // 0時ライトダウン中は星空がより濃く輝く
      skyUniforms.uStarAlpha.value = clamp(baseStar * (1.0 + state.lightDownProgress * 0.85), 0.0, 1.85);
      skyUniforms.uCityGlowIntensity.value = nightLevel * (0.48 - state.lightDownProgress * 0.22);

      // 太陽軌道
      const sunAng = ((h - 6.0) / 24.0) * Math.PI * 2.0;
      const sx = Math.cos(sunAng) * 110;
      const sy = Math.sin(sunAng) * 95;
      const sz = -55;
      sunLight.position.set(sx, Math.max(sy, 8), sz);
      skyUniforms.uSunDir.value.set(sx, sy, sz).normalize();
      skyUniforms.uSunGlow.value = smoothstep(-0.08, 0.14, skyUniforms.uSunDir.value.y);
      sunLight.intensity = THREE.MathUtils.lerp(k0.sunI, k1.sunI, kt);
      hemiLight.intensity = THREE.MathUtils.lerp(k0.hemiI, k1.hemiI, kt);
      bloomPass.strength = THREE.MathUtils.lerp(k0.bloom, k1.bloom, kt) * (1.0 - state.lightDownProgress * 0.25);

      // 時刻HUD更新
      const hh = String(Math.floor(h)).padStart(2, '0');
      const mm = String(Math.floor((h % 1) * 60)).padStart(2, '0');
      hudTime.textContent = `${hh}:${mm} ${getTimeLabel(h)}`;
      sliderVal.textContent = `${hh}:${mm}`;

      // --- タワーライトアップ＆0時ライトダウン演出 ---
      // cutoffY: 0時ライトダウン進行度 (0→1) に応じて -6 → 74 へ上昇し、下から順番に消灯
      const cutoffY = -6.0 + state.lightDownProgress * 80.0;
      pulseUniforms.uTime.value = t;
      pulseUniforms.uMode.value = state.mode;
      pulseUniforms.uLightLevel.value = nightLevel;
      pulseUniforms.uCutoffY.value = cutoffY;

      // 代表カラー計算（濡れ路面・リム・電光ウィンドウで共有）
      let mainGlowCol = colOrange;
      if (state.mode < 0.5) {
        mainGlowCol = colOrange;
      } else if (state.mode < 1.5) {
        mainGlowCol = tmpCol.setHSL((t * 0.14) % 1.0, 0.88, 0.62);
      } else {
        mainGlowCol = tmpCol.copy(colCyan).lerp(colMag, 0.5 + 0.5 * Math.sin(t * 2.8));
      }

      // 高さ別PointLightの更新
      towerLights.forEach((tl, idx) => {
        const yMask = smoothstep(cutoffY - 3.0, cutoffY + 4.0, tl.y) * nightLevel;
        if (state.mode < 0.5) {
          tl.light.color.copy(colOrange);
          tl.light.intensity = (26 + Math.sin(t * 2.0 + idx) * 3) * yMask;
        } else if (state.mode < 1.5) {
          tl.light.color.setHSL((idx / towerLights.length + t * 0.14) % 1.0, 0.88, 0.6);
          tl.light.intensity = (30 + Math.sin(t * 3.5 + idx) * 6) * yMask;
        } else {
          tl.light.color.copy(colCyan).lerp(colMag, 0.5 + 0.5 * Math.sin(t * 3.2 - idx * 0.9));
          tl.light.intensity = (34 + Math.sin(t * 4.8 - idx) * 7) * yMask;
        }
      });

      // 展望台窓・リム・フットタウン・ビル群窓の自動点灯連動
      const mainDeckLit = smoothstep(cutoffY - 2.0, cutoffY + 3.0, 30.0) * nightLevel;
      const footLit = smoothstep(cutoffY - 2.0, cutoffY + 3.0, 3.0) * nightLevel;
      deckGlassMat.emissiveIntensity = 0.15 + mainDeckLit * 1.55;
      deckWindowUniforms.uIntensity.value = 0.08 + mainDeckLit * 1.15;
      deckWindowUniforms.uAccentCol.value.copy(mainGlowCol);
      deckRimMat.color.copy(colOff).lerp(mainGlowCol, mainDeckLit);
      ftWinMat.emissiveIntensity = 0.1 + footLit * 1.4;
      plazaRing.material.color.copy(mainGlowCol);
      plazaRing.material.opacity = 0.08 + footLit * 0.42;
      buildingMat.emissiveIntensity = 0.06 + nightLevel * 0.95;
      strutMat.emissiveIntensity = 0.05 + nightLevel * (1.0 - state.lightDownProgress) * 0.45;

      // 濡れ路面シェーダー更新
      wetUniforms.uTime.value = t;
      wetUniforms.uWetness.value = state.wetness;
      wetUniforms.uTowerColor.value.copy(mainGlowCol);
      wetUniforms.uTowerIntensity.value = nightLevel * (1.0 - state.lightDownProgress * 0.88);
      wetUniforms.uDayFactor.value = dayFactor;
      skyUniforms.uCityGlowCol.value.copy(mainGlowCol).lerp(new THREE.Color(0xff9a52), 0.35);

      // LEDノードの動的更新
      for (let i = 0; i < ledNodes.length; i++) {
        const n = ledNodes[i];
        const lit = smoothstep(cutoffY - 1.5, cutoffY + 2.5, n.y) * nightLevel;
        if (lit < 0.02) {
          ledInst.setColorAt(i, colOff);
        } else {
          if (state.mode < 0.5) {
            const b = (0.72 + 0.28 * Math.sin(t * 2.4 - n.yNorm * 6.0)) * lit;
            tmpCol.setRGB(1.0 * b, 0.52 * b, 0.18 * b);
          } else if (state.mode < 1.5) {
            const hue = (Math.floor(n.yNorm * 7) / 7 + t * 0.16) % 1.0;
            const spark = 0.55 + 0.45 * Math.sin(t * 6.0 + n.phase);
            tmpCol.setHSL(hue, 0.95, (0.45 + spark * 0.35) * lit);
          } else {
            const wave = 0.5 + 0.5 * Math.sin(n.yNorm * 12.0 - t * 5.5);
            tmpCol.copy(colCyan).lerp(colMag, wave).multiplyScalar(lit);
          }
          ledInst.setColorAt(i, tmpCol);
        }
      }
      ledInst.instanceColor.needsUpdate = true;

      // 航空障害灯（赤色点滅・ライトダウン中も安全のため点滅継続）
      const beaconPulse = 0.25 + 0.75 * Math.pow(0.5 + 0.5 * Math.sin(t * 3.4), 3.0);
      beaconMat.color.setRGB(beaconPulse * 1.45, beaconPulse * 0.08, beaconPulse * 0.08);
      beaconLight.intensity = beaconPulse * 18.0;

      // --- シースルーエレベーターの昇降アニメーション ---
      elevators.forEach((ev) => {
        // 0→1→0 を上下端で少し停留しながら往復
        const raw = (t * ev.speed + ev.phase) % 2.0;
        const tri = raw < 1.0 ? raw : 2.0 - raw;
        const u = smoothstep(0.08, 0.92, tri);
        const y = 3.8 + u * 24.4;
        const w = getTowerHalfWidth(y) * 0.98;
        const nextW = getTowerHalfWidth(y + 0.5) * 0.98;
        const tilt = Math.atan2(w - nextW, 0.5);

        if (ev.face === 0) {
          ev.mesh.position.set(ev.offset, y, w);
          ev.mesh.rotation.set(-tilt, 0, 0);
        } else if (ev.face === 1) {
          ev.mesh.position.set(w, y, ev.offset);
          ev.mesh.rotation.set(0, 0, tilt);
        } else {
          ev.mesh.position.set(ev.offset, y, -w);
          ev.mesh.rotation.set(tilt, 0, 0);
        }
      });

      // --- 首都高カーブを流れる車のライト ---
      for (let i = 0; i < hwyCarCount; i++) {
        const c = hwyCars[i];
        c.u = (c.u + c.dir * c.speed * dt + 1.0) % 1.0;
        const pt = expresswayCurve.getPointAt(c.u);
        const tan = expresswayCurve.getTangentAt(c.u).normalize();
        const side = new THREE.Vector3(-tan.z, 0, tan.x).normalize();

        dummy.position.copy(pt).addScaledVector(side, c.laneOffset);
        dummy.position.y += 0.22;
        dummy.rotation.set(0, Math.atan2(tan.x, tan.z), 0);
        dummy.scale.set(1, 1, c.len);
        dummy.updateMatrix();
        hwyCarInst.setMatrixAt(i, dummy.matrix);
      }
      hwyCarInst.instanceMatrix.needsUpdate = true;

      // --- 天候＆花火アニメーション ---
      if (state.weather === 'rain') {
        const arr = rainGeo.attributes.position.array;
        for (let i = 0; i < rainCount; i++) {
          const d = rainDrops[i];
          d.y -= d.spd * dt;
          if (d.y < 0) d.y = 80;
          const base = i * 6;
          arr[base + 0] = d.x;
          arr[base + 1] = d.y;
          arr[base + 2] = d.z;
          arr[base + 3] = d.x - 0.18;
          arr[base + 4] = d.y + 1.8;
          arr[base + 5] = d.z;
        }
        rainGeo.attributes.position.needsUpdate = true;
      } else if (state.weather === 'snow') {
        const arr = snowGeo.attributes.position.array;
        for (let i = 0; i < snowCount; i++) {
          const m = snowMeta[i];
          arr[i * 3 + 1] -= m.spd * dt;
          arr[i * 3 + 0] += Math.sin(t * 1.4 + m.phase) * 0.9 * dt;
          if (arr[i * 3 + 1] < 0) arr[i * 3 + 1] = 82;
        }
        snowGeo.attributes.position.needsUpdate = true;
      } else if (state.weather === 'fireworks') {
        const pArr = fwGeo.attributes.position.array;
        const cArr = fwGeo.attributes.color.array;
        for (let bIdx = 0; bIdx < fwPoolSize; bIdx++) {
          const b = fwBursts[bIdx];
          b.age += dt;
          if (b.age > b.launchDur + b.burstDur) {
            resetBurst(b, 0.2 + Math.random() * 0.6);
          }
          const offset = bIdx * fwSparksPerBurst;
          for (let k = 0; k < fwSparksPerBurst; k++) {
            const idx = (offset + k) * 3;
            if (b.age < 0) {
              pArr[idx + 1] = -999;
              cArr[idx] = cArr[idx + 1] = cArr[idx + 2] = 0;
            } else if (b.age < b.launchDur) {
              // 打ち上げ光跡
              const u = b.age / b.launchDur;
              const y = b.peakY * (1 - Math.pow(1 - u, 2.0));
              const trail = (k / fwSparksPerBurst) * 2.8;
              pArr[idx + 0] = b.origin.x;
              pArr[idx + 1] = Math.max(0, y - trail);
              pArr[idx + 2] = b.origin.z;
              const fade = k < 14 ? (1.0 - k / 14) : 0.0;
              cArr[idx + 0] = 1.0 * fade;
              cArr[idx + 1] = 0.85 * fade;
              cArr[idx + 2] = 0.55 * fade;
            } else {
              // 大輪の開花＋重力落下
              const bt = b.age - b.launchDur;
              const drag = 1.0 - Math.exp(-bt * 1.35);
              const v = b.vels[k];
              pArr[idx + 0] = b.origin.x + v.x * drag * 1.35;
              pArr[idx + 1] = b.peakY + v.y * drag * 1.35 - 4.2 * bt * bt;
              pArr[idx + 2] = b.origin.z + v.z * drag * 1.35;

              const life = clamp(1.0 - bt / b.burstDur, 0.0, 1.0);
              const twinkle = 0.72 + 0.28 * Math.sin(t * 18.0 + k);
              const col = k % 3 === 0 ? b.subCol : b.baseCol;
              cArr[idx + 0] = col.r * life * twinkle;
              cArr[idx + 1] = col.g * life * twinkle;
              cArr[idx + 2] = col.b * life * twinkle;
            }
          }
        }
        fwGeo.attributes.position.needsUpdate = true;
        fwGeo.attributes.color.needsUpdate = true;
      }

      // --- カメラ制御（自動シネマティック or プリセット補間） ---
      if (state.camMode === 'cinematic') {
        state.cinematicTime += dt;
        const ct = state.cinematicTime;
        const ang = ct * 0.14;
        const rad = 52.0 + Math.sin(ct * 0.21) * 18.0;
        const camY = 25.0 + Math.sin(ct * 0.18 - 0.8) * 18.0;
        const lookY = 30.0 - Math.sin(ct * 0.18 - 0.8) * 7.5;
        tmpCamPos.set(Math.cos(ang) * rad, Math.max(camY, 7.0), Math.sin(ang) * rad);
        tmpTarget.set(0, lookY, 0);
        camera.position.lerp(tmpCamPos, 0.03);
        controls.target.lerp(tmpTarget, 0.04);
      } else if (state.camTransition) {
        camera.position.lerp(state.camTransition.pos, Math.min(dt * 3.8, 1.0));
        controls.target.lerp(state.camTransition.target, Math.min(dt * 4.2, 1.0));
        if (
          camera.position.distanceTo(state.camTransition.pos) < 0.22 &&
          controls.target.distanceTo(state.camTransition.target) < 0.22
        ) {
          state.camTransition = null;
        }
      }

      controls.update();
      composer.render();
    }

    // --- リサイズ対応 ---
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const pr = Math.min(window.devicePixelRatio, 2);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      renderer.setPixelRatio(pr);
      composer.setSize(w, h);
      bloomPass.resolution.set(w, h);
      snowMat.uniforms.uPixelRatio.value = pr;
      fwMat.uniforms.uPixelRatio.value = pr;
    });

    animate();
  } catch (err) {
    showError('3Dシーンの読み込み中にエラーが発生しました: ' + (err?.message || err));
  }
}

window.onload = initTokyoTowerCinematic;
</script>
