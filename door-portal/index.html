<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>どこでもドア — 3Dポータル</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js r128 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
      background-color: #0f172a;
      user-select: none;
      touch-action: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* グラスモーフィズムパネル */
    .glass-panel {
      background: rgba(15, 23, 42, 0.62);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    .glass-chip {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.16);
      transition: all 0.2s ease;
    }

    .glass-chip:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: translateY(-1px);
    }

    .glass-chip:active {
      transform: translateY(0);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    #mobile-move-pad { touch-action: none; }
    .move-pad-btn { touch-action: none; }
    .move-pad-btn.is-held {
      background: rgba(56, 189, 248, 0.38);
      border-color: rgba(125, 211, 252, 0.85);
    }
    @media (min-width: 1024px) and (pointer: fine) {
      #mobile-move-pad { display: none; }
    }

    /* トースト通知アニメーション */
    .toast-enter {
      opacity: 0;
      transform: translate(-50%, -14px);
    }
    .toast-active {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body class="text-white antialiased">

  <!-- 3Dキャンバスコンテナ -->
  <div id="canvas-container"></div>

  <!-- 画面中央上部: トースト通知 -->
  <div id="toast-message"
       class="fixed top-5 left-1/2 z-50 pointer-events-none transition-all duration-300 toast-enter glass-panel px-4 py-2.5 rounded-full text-xs sm:text-sm font-medium text-white/95 flex items-center gap-2 max-w-[92vw] whitespace-nowrap">
    <span id="toast-icon">🚪</span>
    <span id="toast-text">準備完了</span>
  </div>

  <!-- 左上: ステータス・オフライン表示・ツールボタン -->
  <div class="fixed top-4 left-4 z-30 flex flex-col gap-2 items-start">
    <div class="flex items-center gap-2 flex-wrap">
      <div class="glass-panel rounded-full px-3.5 py-2 flex items-center gap-2 text-xs sm:text-sm font-medium">
        <span id="location-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.9)]"></span>
        <span id="location-label">白いギャラリー空間</span>
      </div>

      <button id="btn-sound" title="効果音のオン/オフ"
              class="glass-panel rounded-full p-2.5 text-white/85 hover:text-white hover:bg-white/15 transition">
        <svg id="icon-sound-on" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z" />
        </svg>
        <svg id="icon-sound-off" class="w-4 h-4 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
        </svg>
      </button>

      <button id="btn-reset-cam" title="視点を正面に戻す"
              class="glass-panel rounded-full p-2.5 text-white/85 hover:text-white hover:bg-white/15 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>

      <button id="btn-toggle-pad" title="移動パッドの表示切替" aria-label="移動パッドの表示切替" aria-controls="mobile-move-pad"
              class="glass-panel rounded-full p-2.5 text-white/85 hover:text-white hover:bg-white/15 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18M3 12h18M12 3l-3 3m3-3l3 3M12 21l-3-3m3 3l3-3M3 12l3-3m-3 3l3 3M21 12l-3-3m3 3l-3 3" />
        </svg>
      </button>
    </div>

    <!-- 生成方法の表示 -->
    <div class="glass-panel rounded-full px-3 py-1 text-[10px] sm:text-[11px] text-emerald-200/95 flex items-center gap-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
      <span>景色は端末内で生成（API不要）</span>
    </div>
  </div>

  <!-- 右上: 世界情報カード＆解釈タグ＆操作ガイド -->
  <div class="fixed top-24 right-4 lg:top-4 z-30 flex flex-col items-end gap-2 max-w-[270px] sm:max-w-xs pointer-events-none">
    <div id="world-info-card" class="glass-panel rounded-2xl p-3.5 sm:p-4 transition-all duration-300 opacity-0 translate-y-[-8px] w-full">
      <div class="flex items-center justify-between gap-2 mb-1">
        <span id="world-mode-badge" class="text-[10px] font-semibold tracking-wide px-2 py-0.5 rounded-full bg-sky-500/30 text-sky-200 border border-sky-400/35">
          キーワード解析
        </span>
        <span class="text-[10px] text-white/55">ポータル展開中</span>
      </div>
      <h2 id="world-title" class="text-sm sm:text-base font-bold text-white leading-snug"></h2>
      <p id="world-desc" class="text-[11px] sm:text-xs text-white/75 mt-1 leading-relaxed"></p>
      <!-- オフラインエンジンが解釈した要素タグ -->
      <div id="world-tags" class="flex flex-wrap gap-1 mt-2.5 pt-2 border-t border-white/10"></div>
    </div>

    <!-- PC向け操作ガイド -->
    <div class="glass-panel rounded-xl px-3 py-2 text-[11px] text-white/75 hidden lg:flex flex-col gap-0.5 pointer-events-auto">
      <div><span class="text-white font-medium">ドラッグ</span>：360° 視点を見渡す</div>
      <div><span class="text-white font-medium">WASD / 矢印</span>：歩く・ドアをくぐる</div>
    </div>
  </div>

  <!-- 画面下部: メイン操作パネル（折りたたみ可能） -->
  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-40 w-[94vw] max-w-2xl flex flex-col items-center gap-2 pointer-events-none">
    <!-- タッチ端末（モバイル・iPad）向け移動パッド -->
    <div id="mobile-move-pad" class="self-end flex flex-col items-center gap-1.5">
      <button data-move="forward" aria-label="前進"
              class="move-pad-btn pointer-events-auto glass-panel w-12 h-12 rounded-full flex items-center justify-center text-white/95 active:bg-white/30">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg>
      </button>
      <div class="flex items-center gap-1.5">
        <button data-move="left" aria-label="左移動"
                class="move-pad-btn pointer-events-auto glass-panel w-12 h-12 rounded-full flex items-center justify-center text-white/95 active:bg-white/30">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <button data-move="backward" aria-label="後退"
                class="move-pad-btn pointer-events-auto glass-panel w-12 h-12 rounded-full flex items-center justify-center text-white/95 active:bg-white/30">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <button data-move="right" aria-label="右移動"
                class="move-pad-btn pointer-events-auto glass-panel w-12 h-12 rounded-full flex items-center justify-center text-white/95 active:bg-white/30">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>

    <!-- 折りたたみトグル -->
    <button id="btn-toggle-panel"
            class="glass-panel pointer-events-auto rounded-full px-4 py-1.5 text-xs text-white/85 hover:text-white flex items-center gap-1.5 transition">
      <svg id="toggle-chevron" class="w-3.5 h-3.5 transition-transform duration-300" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
      </svg>
      <span id="toggle-label">UIを隠して3Dを広く見る</span>
    </button>

    <!-- コントロールパネル本体 -->
    <div id="control-panel" class="glass-panel pointer-events-auto rounded-3xl p-3.5 sm:p-4 w-full transition-all duration-300">
      <!-- プリセットチップ -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-2.5 mb-2.5 border-b border-white/10">
        <span class="text-[11px] text-white/55 shrink-0 mr-1">プリセット:</span>
        <button class="preset-chip glass-chip rounded-full px-3 py-1.5 text-xs text-white/95 shrink-0" data-prompt="夕暮れの桜とお城">🏯 夕暮れの桜とお城</button>
        <button class="preset-chip glass-chip rounded-full px-3 py-1.5 text-xs text-white/95 shrink-0" data-prompt="オーロラの雪山">🌌 オーロラの雪山</button>
        <button class="preset-chip glass-chip rounded-full px-3 py-1.5 text-xs text-white/95 shrink-0" data-prompt="ネオン輝く夜の東京">🗼 ネオン輝く夜の東京</button>
        <button class="preset-chip glass-chip rounded-full px-3 py-1.5 text-xs text-white/95 shrink-0" data-prompt="満天の星空と海">🌊 満天の星空と海</button>
        <button class="preset-chip glass-chip rounded-full px-3 py-1.5 text-xs text-white/95 shrink-0" data-prompt="霧の竹林と赤い鳥居">⛩️ 霧の竹林と赤い鳥居</button>
        <button class="preset-chip glass-chip rounded-full px-3 py-1.5 text-xs text-white/95 shrink-0" data-prompt="宇宙のクリスタル遺跡">💎 宇宙のクリスタル遺跡</button>
        <button class="preset-chip glass-chip rounded-full px-3 py-1.5 text-xs text-white/95 shrink-0" data-prompt="夕焼けの砂漠とピラミッド">🏜️ 夕焼けの砂漠とピラミッド</button>
        <button class="preset-chip glass-chip rounded-full px-3 py-1.5 text-xs text-white/95 shrink-0" data-prompt="火の粉が舞う火山の古代遺跡">🌋 火山の古代遺跡</button>
      </div>

      <!-- 入力フォーム＋生成ボタン＋ランダムボタン -->
      <form id="portal-form" class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
        <div class="relative flex-1">
          <input id="destination-input"
                 type="text"
                 autocomplete="off"
                 placeholder="行きたい場所を入力（例：雪の降る竹林と鳥居、夕焼けの海とヤシの木）"
                 class="w-full bg-white/10 border border-white/20 rounded-2xl px-4 py-3 text-sm text-white placeholder-white/45 focus:outline-none focus:ring-2 focus:ring-sky-400/75 focus:bg-white/15 transition" />
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button id="btn-open-door" type="submit"
                  class="flex-1 sm:flex-none rounded-2xl px-4 sm:px-5 py-3 text-sm font-semibold text-white bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-400 hover:to-indigo-400 active:scale-[0.98] transition shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-1.5">
            <span>🚪</span>
            <span>世界を生成して開ける</span>
          </button>
          <button id="btn-random" type="button" title="ランダムな世界を生成"
                  class="rounded-2xl px-3.5 py-3 text-sm font-medium text-white/95 bg-white/12 hover:bg-white/22 border border-white/15 active:scale-[0.98] transition flex items-center justify-center gap-1 shrink-0">
            <span>🎲</span>
            <span class="hidden sm:inline">ランダム</span>
          </button>
        </div>
      </form>

      <!-- ドア操作バー（くぐる／開閉） -->
      <div id="door-actions" class="mt-2.5 pt-2.5 border-t border-white/10 flex items-center justify-between gap-2">
        <button id="btn-enter-exit"
                class="flex-1 rounded-2xl px-4 py-2.5 text-xs sm:text-sm font-semibold text-white bg-emerald-500/85 hover:bg-emerald-400 active:scale-[0.98] transition flex items-center justify-center gap-2 shadow-md shadow-emerald-500/20 disabled:opacity-45">
          <span id="enter-exit-icon">🚶</span>
          <span id="enter-exit-text">ドアをくぐって中へ入る</span>
        </button>
        <button id="btn-toggle-door"
                class="rounded-2xl px-4 py-2.5 text-xs sm:text-sm font-medium text-white/95 bg-white/12 hover:bg-white/22 border border-white/15 active:scale-[0.98] transition shrink-0">
          ドアを開ける
        </button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. 定数とアプリケーション状態
    // =========================================================================
    const DOOR_WIDTH = 2.05;
    const DOOR_HEIGHT = 3.25;
    const EYE_HEIGHT = 1.65;
    const OPEN_ANGLE = -Math.PI * 0.63; // 手前(+Z側)に約113度開く

    const state = {
      inWorld: false,            // false: 白いギャラリー空間 / true: 生成された異空間
      doorOpen: false,           // ドアの開閉目標状態
      doorAngle: 0,              // 現在の開き角度
      targetDoorAngle: 0,        // 目標角度
      soundEnabled: true,
      panelCollapsed: false,
      currentWorldData: null,
      // カメラ視点
      yaw: 0,
      pitch: 0.02,
      lookPointerId: null,
      lastPointerX: 0,
      lastPointerY: 0,
      // 移動入力
      heldKeys: new Set(),
      padPointers: new Map(),
      // 自動歩行（ドアをくぐるボタン用）
      autoWalk: {
        active: false,
        targetPos: new THREE.Vector3(),
        targetYaw: 0,
        targetPitch: 0
      },
      portalCooldown: 0,
      glowPulse: 0
    };

    const movementKeys = new Map([
      ['KeyW', 'forward'], ['ArrowUp', 'forward'],
      ['KeyS', 'backward'], ['ArrowDown', 'backward'],
      ['KeyA', 'left'], ['ArrowLeft', 'left'],
      ['KeyD', 'right'], ['ArrowRight', 'right']
    ]);

    // Three.js オブジェクト
    let renderer, camera, clock;
    let homeScene, portalScene, maskScene;
    let doorGroup, doorPivot, doorGlowMesh;
    let portalMaskFront, portalMaskBack;
    let portalDynamicGroup;

    // アニメーション対象リスト
    let animatedWaterMesh = null;
    let animatedAuroraMesh = null;
    let animatedFloaters = [];
    let animatedPlanets = [];
    let particleSystem = null;
    let particleMeta = null;

    // Web Audio API
    let audioCtx = null;

    // =========================================================================
    // 2. 決定論的ハッシュ＆疑似乱数ジェネレーター（自由入力用）
    // =========================================================================
    function hashString(str) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function createSeededRng(seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0;
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function hslToHex(h, s, l) {
      const c = new THREE.Color().setHSL((((h % 360) + 360) % 360) / 360, s, l);
      return '#' + c.getHexString();
    }

    // =========================================================================
    // 3. 完全オフライン効果音（Web Audio API）
    // =========================================================================
    function ensureAudioContext() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playDoorSound(isOpening) {
      if (!state.soundEnabled) return;
      try {
        ensureAudioContext();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        if (isOpening) {
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.34);
        } else {
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.exponentialRampToValueAtTime(105, now + 0.26);
        }
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.075, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.38);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } catch (e) {}
    }

    function playPortalChord(isEntering = true) {
      if (!state.soundEnabled) return;
      try {
        ensureAudioContext();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const notes = isEntering
          ? [392.0, 493.88, 587.33, 783.99, 987.77] // Gメジャー9th系の幻想的和音
          : [523.25, 440.0, 392.0, 329.63];
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          const start = now + i * 0.055;
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.0008, start);
          gain.gain.linearRampToValueAtTime(0.045, start + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0006, start + 0.85);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(start);
          osc.stop(start + 0.9);
        });
      } catch (e) {}
    }

    // =========================================================================
    // 4. プロシージャルテクスチャ生成（画像ファイル不使用）
    // =========================================================================
    function createWoodTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#8b5a3c';
      ctx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 160; i++) {
        ctx.fillStyle = i % 2 === 0 ? 'rgba(46, 25, 13, 0.15)' : 'rgba(186, 135, 96, 0.14)';
        ctx.fillRect(Math.random() * 512, 0, 1 + Math.random() * 4, 512);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function createGalleryGridTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#f3f6fa';
      ctx.fillRect(0, 0, 512, 512);
      ctx.strokeStyle = 'rgba(100, 116, 139, 0.16)';
      ctx.lineWidth = 2;
      for (let i = 0; i <= 512; i += 64) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(38, 38);
      return tex;
    }

    function createCityRoadTexture(accentHex) {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#0d101c';
      ctx.fillRect(0, 0, 512, 512);
      ctx.strokeStyle = accentHex || '#38bdf8';
      ctx.lineWidth = 2.5;
      ctx.globalAlpha = 0.45;
      for (let i = 0; i <= 512; i += 64) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(34, 34);
      return tex;
    }

    function createBuildingWindowTexture(baseHex, accentHex) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = baseHex || '#131829';
      ctx.fillRect(0, 0, 256, 512);
      const cols = 6, rows = 16, px = 10, py = 10;
      const w = (256 - px * (cols + 1)) / cols;
      const h = (512 - py * (rows + 1)) / rows;
      for (let r = 0; r < rows; r++) {
        for (let col = 0; col < cols; col++) {
          if (Math.random() > 0.32) {
            ctx.fillStyle = Math.random() > 0.3 ? (accentHex || '#38bdf8') : '#fef08a';
            ctx.globalAlpha = 0.4 + Math.random() * 0.6;
            ctx.fillRect(px + col * (w + px), py + r * (h + py), w, h);
          }
        }
      }
      ctx.globalAlpha = 1;
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function createStoneWallTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#57534e';
      ctx.fillRect(0, 0, 256, 256);
      for (let y = 0; y < 256; y += 32) {
        const offset = (y / 32) % 2 === 0 ? 0 : 24;
        for (let x = -24; x < 256; x += 48) {
          const shade = 95 + Math.floor(Math.random() * 35);
          ctx.fillStyle = `rgb(${shade}, ${shade - 4}, ${shade - 8})`;
          ctx.fillRect(x + offset + 2, y + 2, 44, 28);
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 2);
      return tex;
    }

    function createSkyDome(topHex, midHex, bottomHex) {
      const geo = new THREE.SphereGeometry(185, 32, 24);
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          topColor: { value: new THREE.Color(topHex) },
          midColor: { value: new THREE.Color(midHex || bottomHex) },
          bottomColor: { value: new THREE.Color(bottomHex) }
        },
        vertexShader: `
          varying vec3 vWorldPos;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 topColor;
          uniform vec3 midColor;
          uniform vec3 bottomColor;
          varying vec3 vWorldPos;
          void main() {
            float h = normalize(vWorldPos).y;
            vec3 col = mix(bottomColor, midColor, smoothstep(-0.05, 0.28, h));
            col = mix(col, topColor, smoothstep(0.25, 0.85, h));
            gl_FragColor = vec4(col, 1.0);
          }
        `,
        side: THREE.BackSide,
        depthWrite: false,
        fog: false
      });
      return new THREE.Mesh(geo, mat);
    }

    // =========================================================================
    // 5. 高度なオフライン日本語キーワード解析＆合成エンジン
    // =========================================================================
    function analyzePromptOffline(rawInput) {
      const text = (rawInput || '').trim() || '静かな緑の森';
      const lower = text.toLowerCase();
      const seed = hashString(text);
      const rng = createSeededRng(seed);

      const tags = [];
      let matchedAny = false;

      // --- A. 時間帯・空・ライティング解析 ---
      let timeKey = null;
      const timeRules = [
        { key: 'aurora',  label: 'オーロラの夜', match: /オーロラ|極夜|北極|aurora/ },
        { key: 'space',   label: '深宇宙',       match: /宇宙|銀河|星雲|惑星|ステーション|月面|space|galaxy/ },
        { key: 'cyber',   label: 'ネオンナイト', match: /サイバー|ネオン|未来|電脳|cyber|neon/ },
        { key: 'sunset',  label: '夕暮れ',       match: /夕暮|夕焼|夕方|黄昏|茜|日没|サンセット|sunset|dusk/ },
        { key: 'night',   label: '星空・夜',     match: /夜|星空|満天|月夜|月|蛍|ほたる|ナイト|night|star|moon/ },
        { key: 'foggy',   label: '幻想の霧',     match: /霧|幻想|神秘|幽玄|もののけ|mist|fog|mystic/ },
        { key: 'morning', label: '朝・青空',     match: /朝|青空|昼|晴|南国|夏|morning|sunny|day/ }
      ];
      for (const r of timeRules) {
        if (r.match.test(lower)) {
          timeKey = r.key;
          tags.push({ category: '空', label: r.label });
          matchedAny = true;
          break;
        }
      }

      // --- B. 地形・地面解析 ---
      let groundKey = null;
      const groundRules = [
        { key: 'volcano', label: '火山・溶岩',   match: /火山|溶岩|マグマ|地獄|灼熱|volcano|lava/ },
        { key: 'space',   label: '浮遊回廊',     match: /宇宙|銀河|惑星|ステーション|space/ },
        { key: 'snow',    label: '雪原・雪山',   match: /雪|氷|冬|スキー|ゲレンデ|北極|オーロラ|snow|ice/ },
        { key: 'ocean',   label: '海・砂浜',     match: /海|砂浜|ビーチ|南国|沖縄|ハワイ|島|湖|水上|ocean|sea|beach/ },
        { key: 'desert',  label: '砂漠',         match: /砂漠|ピラミッド|サハラ|砂丘|荒野|火星|desert|sand/ },
        { key: 'city',    label: '都市・石畳',   match: /東京|渋谷|新宿|都市|街|ビル|サイバー|ネオン|city|tokyo|cyber/ },
        { key: 'stone',   label: '石畳・境内',   match: /鳥居|神社|寺|遺跡|城|京都|洞窟|stone|shrine|ruin/ },
        { key: 'grass',   label: '草原・森',     match: /草原|森|林|桜|竹|公園|緑|花|山|grass|forest/ }
      ];
      for (const r of groundRules) {
        if (r.match.test(lower)) {
          groundKey = r.key;
          tags.push({ category: '地形', label: r.label });
          matchedAny = true;
          break;
        }
      }

      // --- C. ランドマーク・オブジェクト解析（複数同時対応！） ---
      const landmarks = [];
      const landmarkRules = [
        { key: 'castle',      label: 'お城',             match: /城|天守閣|城下町|castle/ },
        { key: 'tokyo_tower', label: '東京タワー風鉄塔', match: /東京タワー|東京|鉄塔|タワー|tower|tokyo/ },
        { key: 'torii',       label: '赤い鳥居',         match: /鳥居|神社|稲荷|京都|torii|shrine/ },
        { key: 'sakura',      label: '桜の木',           match: /桜|さくら|サクラ|花見|sakura/ },
        { key: 'bamboo',      label: '竹林',             match: /竹|竹林|bamboo/ },
        { key: 'pyramid',     label: 'ピラミッド',       match: /ピラミッド|エジプト|スフィンクス|pyramid/ },
        { key: 'ruins',       label: '古代遺跡',         match: /遺跡|神殿|パルテノン|廃墟|柱|ruin|temple/ },
        { key: 'crystals',    label: '浮遊クリスタル',   match: /クリスタル|水晶|宝石|洞窟|魔法|結晶|crystal|magic/ },
        { key: 'buildings',   label: '高層ビル群',       match: /ビル|都市|東京|渋谷|サイバー|ネオン|街|city|cyber/ },
        { key: 'palm',        label: 'ヤシの木',         match: /ヤシ|椰子|南国|ビーチ|ハワイ|沖縄|島|palm|beach/ },
        { key: 'pine',        label: '針葉樹',           match: /針葉樹|雪山|冬|雪|オーロラ|もみの木|pine|snow/ },
        { key: 'planets',     label: '巨大惑星',         match: /惑星|宇宙|銀河|土星|月面|planet|space/ },
        { key: 'mountains',   label: '山脈',             match: /山|雪山|富士|火山|アルプス|mountain|volcano/ },
        { key: 'trees',       label: '森の木々',         match: /森|林|木|公園|自然|forest|tree/ }
      ];
      for (const r of landmarkRules) {
        if (r.match.test(lower)) {
          landmarks.push(r.key);
          tags.push({ category: '造形', label: r.label });
          matchedAny = true;
        }
      }

      // --- D. パーティクル演出解析 ---
      let particleKey = null;
      const particleRules = [
        { key: 'embers',    label: '火の粉',       match: /火の粉|火山|溶岩|炎|マグマ|fire|lava|volcano/ },
        { key: 'petals',    label: '桜吹雪',       match: /桜|さくら|サクラ|花吹雪|花びら|sakura|petal/ },
        { key: 'snow',      label: '雪',           match: /雪|吹雪|冬|オーロラ|snow/ },
        { key: 'rain',      label: '雨',           match: /雨|梅雨|嵐|rain/ },
        { key: 'fireflies', label: '蛍・光の粒子', match: /蛍|ほたる|霧|幻想|魔法|クリスタル|竹|鳥居|firefl|magic/ },
        { key: 'stars',     label: '星屑',         match: /星|宇宙|銀河|ネオン|サイバー|star|space/ }
      ];
      for (const r of particleRules) {
        if (r.match.test(lower)) {
          particleKey = r.key;
          tags.push({ category: '演出', label: r.label });
          matchedAny = true;
          break;
        }
      }

      // --- E. 未指定要素の自然な補完 または 自由入力ハッシュ生成 ---
      const isProceduralHash = !matchedAny;

      if (isProceduralHash) {
        // 辞書にない言葉（ファンタジー地名など）は文字列ハッシュから調和の取れた世界を合成
        const timePool = ['sunset', 'night', 'aurora', 'foggy', 'morning', 'space'];
        const groundPool = ['grass', 'snow', 'ocean', 'desert', 'stone', 'space', 'volcano'];
        const lmPool = ['crystals', 'ruins', 'castle', 'sakura', 'bamboo', 'torii', 'pyramid', 'planets', 'trees', 'pine'];
        const partPool = ['fireflies', 'stars', 'petals', 'snow', 'embers'];

        timeKey = timePool[Math.floor(rng() * timePool.length)];
        groundKey = groundPool[Math.floor(rng() * groundPool.length)];
        const lm1 = lmPool[Math.floor(rng() * lmPool.length)];
        const lm2 = lmPool[Math.floor(rng() * lmPool.length)];
        landmarks.push(lm1);
        if (lm2 !== lm1 && rng() > 0.35) landmarks.push(lm2);
        particleKey = partPool[Math.floor(rng() * partPool.length)];

        const labelMap = {
          aurora: 'オーロラ', space: '深宇宙', sunset: '夕暮れ', night: '星空', foggy: '幻想の霧', morning: '青空',
          grass: '草原', snow: '雪原', ocean: '海', desert: '砂漠', stone: '石畳', volcano: '火山',
          crystals: 'クリスタル', ruins: '古代遺跡', castle: 'お城', sakura: '桜', bamboo: '竹林',
          torii: '鳥居', pyramid: 'ピラミッド', planets: '惑星', trees: '森', pine: '針葉樹',
          fireflies: '光の粒子', stars: '星屑', petals: '花吹雪', embers: '火の粉'
        };
        tags.push({ category: 'シード', label: `#${(seed % 10000).toString().padStart(4, '0')}` });
        tags.push({ category: '空', label: labelMap[timeKey] });
        tags.push({ category: '地形', label: labelMap[groundKey] });
        landmarks.forEach((l) => tags.push({ category: '造形', label: labelMap[l] }));
      } else {
        // 部分マッチ時は自然な組み合わせで不足分を補完
        if (!timeKey) {
          if (groundKey === 'volcano') timeKey = 'sunset';
          else if (groundKey === 'city') timeKey = 'cyber';
          else if (groundKey === 'space') timeKey = 'space';
          else if (landmarks.includes('crystals') || landmarks.includes('torii')) timeKey = 'night';
          else timeKey = 'morning';
        }
        if (!groundKey) {
          if (timeKey === 'space') groundKey = 'space';
          else if (timeKey === 'cyber') groundKey = 'city';
          else if (timeKey === 'aurora') groundKey = 'snow';
          else if (landmarks.includes('pyramid')) groundKey = 'desert';
          else if (landmarks.includes('palm')) groundKey = 'ocean';
          else groundKey = 'grass';
        }
        if (landmarks.length === 0) {
          if (groundKey === 'ocean') landmarks.push('palm');
          else if (groundKey === 'snow') landmarks.push('pine', 'mountains');
          else if (groundKey === 'desert') landmarks.push('pyramid');
          else if (groundKey === 'city') landmarks.push('buildings');
          else if (groundKey === 'space') landmarks.push('planets');
          else if (groundKey === 'volcano') landmarks.push('mountains', 'ruins');
          else landmarks.push('trees');
        }
        if (!particleKey) {
          if (groundKey === 'snow') particleKey = 'snow';
          else if (groundKey === 'volcano') particleKey = 'embers';
          else if (timeKey === 'space' || timeKey === 'night') particleKey = 'stars';
          else if (timeKey === 'foggy') particleKey = 'fireflies';
          else particleKey = 'none';
        }
      }

      // --- F. パレット＆ライティング決定 ---
      const skyPresets = {
        morning: { top: '#0284c7', mid: '#38bdf8', bottom: '#e0f2fe', fog: '#dbeafe', fogD: 0.0085, light: '#fffbeb', int: 1.25, celestial: 'sun' },
        sunset:  { top: '#31105f', mid: '#c2410c', bottom: '#fdba74', fog: '#f97316', fogD: 0.012,  light: '#ffd7aa', int: 1.15, celestial: 'sun' },
        night:   { top: '#020617', mid: '#0f172a', bottom: '#1e293b', fog: '#0f172a', fogD: 0.013,  light: '#cbd5e1', int: 0.85, celestial: 'moon' },
        aurora:  { top: '#020617', mid: '#0c2338', bottom: '#134e4a', fog: '#0f293a', fogD: 0.013,  light: '#a7f3d0', int: 0.95, celestial: 'aurora' },
        cyber:   { top: '#050414', mid: '#1e1042', bottom: '#3b0764', fog: '#190d36', fogD: 0.018,  light: '#38bdf8', int: 0.95, celestial: 'moon' },
        foggy:   { top: '#334155', mid: '#64748b', bottom: '#cbd5e1', fog: '#94a3b8', fogD: 0.026,  light: '#e2e8f0', int: 0.95, celestial: 'none' },
        space:   { top: '#010108', mid: '#070b1e', bottom: '#111838', fog: '#040614', fogD: 0.004,  light: '#e0f2fe', int: 1.1,  celestial: 'stars' }
      };

      const skyCfg = { ...skyPresets[timeKey] };

      // 火山地面の場合は空と霧に赤みを帯びさせる
      if (groundKey === 'volcano') {
        skyCfg.top = '#1c0a0a';
        skyCfg.mid = '#7c2d12';
        skyCfg.bottom = '#ea580c';
        skyCfg.fog = '#7c2d12';
        skyCfg.fogD = 0.017;
        skyCfg.light = '#fdba74';
      }

      // 自由入力ハッシュ時は色相を少し個性化
      const customAccent = isProceduralHash
        ? hslToHex(Math.floor(rng() * 360), 0.78, 0.65)
        : (timeKey === 'cyber' ? '#22d3ee' : groundKey === 'volcano' ? '#f97316' : '#38bdf8');

      // 説明文の自動生成
      const descParts = [];
      if (isProceduralHash) {
        descParts.push(`「${text}」の響きから固有シードを算出し、この場所だけの3D空間を合成しました。`);
      } else {
        const tDesc = {
          morning: '爽やかな陽光が差し込む空の下、',
          sunset: '茜色に染まる黄昏の空の下、',
          night: '静かな月と無数の星が瞬く夜空の下、',
          aurora: '神秘的なオーロラが揺らめく夜空の下、',
          cyber: '鮮やかなネオンが闇夜に映える空間に、',
          foggy: '幻想的な白い霧が立ち込める静寂の中、',
          space: '果てしない星々が広がる深宇宙に、'
        }[timeKey];
        descParts.push(tDesc);
        descParts.push('ドアの向こうへ歩み出て自由に探索できます。');
      }

      return {
        title: text,
        description: descParts.join(''),
        isProceduralHash,
        seed,
        tags: tags.slice(0, 5),
        timeKey,
        groundKey,
        landmarks: landmarks.slice(0, 3), // 最大3種類まで美しく共存
        particleKey,
        skyTopColor: skyCfg.top,
        skyMidColor: skyCfg.mid,
        skyBottomColor: skyCfg.bottom,
        fogColor: skyCfg.fog,
        fogDensity: skyCfg.fogD,
        lightColor: skyCfg.light,
        lightIntensity: skyCfg.int,
        celestialType: skyCfg.celestial,
        accentColor: customAccent
      };
    }

    // 初期空間：清潔感のある白いギャラリー空間
    function buildHomeSpace() {
      homeScene.add(createSkyDome('#dde5ef', '#edf2f7', '#ffffff'));

      const hemi = new THREE.HemisphereLight(0xffffff, 0xcbd5e1, 0.95);
      homeScene.add(hemi);

      const dir = new THREE.DirectionalLight(0xfffaf0, 0.85);
      dir.position.set(6, 12, 8);
      dir.castShadow = true;
      dir.shadow.mapSize.width = 1024;
      dir.shadow.mapSize.height = 1024;
      const d = 8;
      dir.shadow.camera.left = -d;
      dir.shadow.camera.right = d;
      dir.shadow.camera.top = d;
      dir.shadow.camera.bottom = -d;
      homeScene.add(dir);

      ring.position.y = 0.008;
