<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>小さな灯りの村 — ピクセル箱庭</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #141c26;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", monospace, sans-serif;
    color: #f6f1e7;
  }
  #canvas-container { position: fixed; inset: 0; }
  #bubbles-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 6; }

  /* ピクセル風パネル */
  .hud-top {
    position: fixed; top: 14px; left: 14px; right: 14px;
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px;
    pointer-events: none; z-index: 10;
  }
  .panel {
    pointer-events: auto;
    background: rgba(24, 30, 40, 0.78);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 2px solid rgba(255, 240, 210, 0.35);
    box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.35);
    padding: 10px 14px;
  }
  .title-sub { font-size: 10px; letter-spacing: 0.16em; opacity: 0.72; }
  .title-main { font-size: 17px; font-weight: 700; margin-top: 2px; letter-spacing: 0.06em; }
  .clock-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; }
  .time-badge {
    background: #e6b86a; color: #1d2228; font-weight: 700;
    padding: 2px 8px;
  }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    pointer-events: auto; cursor: pointer;
    background: rgba(255, 248, 235, 0.12); color: #f6f1e7;
    border: 2px solid rgba(255, 240, 210, 0.32);
    padding: 5px 10px; font-size: 12px; font-weight: 600;
    transition: background 0.15s;
  }
  button:hover { background: rgba(255, 248, 235, 0.24); }
  button.active { background: #e6b86a; color: #1d2228; border-color: #ffe3a8; }

  /* 頭上のピクセル風・会話吹き出し */
  .speech-bubble {
    position: absolute;
    transform: translate(-50%, -100%);
    background: #fffdf7;
    color: #24211e;
    border: 2px solid #2b2623;
    box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.28);
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.35;
    white-space: nowrap;
    max-width: 220px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .speech-bubble.show { opacity: 1; }
  .speech-bubble.chat { background: #fff7df; border-color: #7c4d25; }
  .speech-bubble::after {
    content: "";
    position: absolute;
    left: 50%; bottom: -7px;
    transform: translateX(-50%);
    width: 8px; height: 6px;
    background: inherit;
    border-left: 2px solid #2b2623;
    border-right: 2px solid #2b2623;
    border-bottom: 2px solid #2b2623;
  }
  .speech-bubble .spk {
    display: block; font-size: 9px; color: #8c5a2b; margin-bottom: 1px;
  }

  /* 右下：選択中の住民カード */
  .villager-card {
    position: fixed; right: 14px; bottom: 14px; width: 265px; z-index: 10;
    transition: transform 0.25s ease, opacity 0.2s ease;
  }
  .villager-card.hidden { opacity: 0; transform: translateY(14px); pointer-events: none; }
  .v-header { display: flex; justify-content: space-between; align-items: center; }
  .v-name { font-size: 15px; font-weight: 700; }
  .v-role { font-size: 11px; opacity: 0.78; margin-top: 2px; }
  .v-status {
    margin-top: 8px; padding: 8px; background: rgba(255, 255, 255, 0.08);
    font-size: 12px; line-height: 1.5;
  }
  .v-close { padding: 2px 7px; font-size: 11px; }

  .hint {
    position: fixed; left: 14px; bottom: 14px; z-index: 10;
    font-size: 11px; opacity: 0.82;
    background: rgba(24, 30, 40, 0.7); padding: 5px 10px;
    border: 2px solid rgba(255, 240, 210, 0.22); pointer-events: none;
  }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="bubbles-layer"></div>

<div class="hud-top">
  <div class="panel">
    <div class="title-sub">PIXEL STACKING AUTONOMOUS VILLAGE</div>
    <div class="title-main">小さな灯りの村</div>
    <div class="clock-row">
      <span class="time-badge" id="clock-text">07:00 朝</span>
      <span id="weather-text" style="opacity:0.88;">パン屋の煙突から煙がのぼる</span>
    </div>
  </div>

  <div class="panel controls">
    <button id="btn-pause">一時停止</button>
    <button id="btn-speed1" class="active">1x</button>
    <button id="btn-speed4">4x</button>
    <button id="btn-bubbles" class="active">吹き出し ON</button>
    <button id="btn-reset-cam">全体</button>
  </div>
</div>

<div class="hint">ドラッグで回転 ・ ピンチで拡大 ・ 村人をタップで追尾</div>

<div class="panel villager-card hidden" id="villager-card">
  <div class="v-header">
    <div>
      <div class="v-name" id="v-name"></div>
      <div class="v-role" id="v-role"></div>
    </div>
    <button class="v-close" id="v-close">解除</button>
  </div>
  <div class="v-status" id="v-status"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- 基本セットアップ ---
const container = document.getElementById('canvas-container');
const bubblesLayer = document.getElementById('bubbles-layer');

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x9ec5d8, 0.013);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(22, 20, 24);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.46;
controls.minDistance = 8;
controls.maxDistance = 48;
controls.target.set(0, 1.2, 0);

// --- ライティング ---
const hemiLight = new THREE.HemisphereLight(0xe6f5ff, 0x5c6b48, 0.9);
scene.add(hemiLight);

const sunLight = new THREE.DirectionalLight(0xfff1d6, 2.2);
sunLight.position.set(18, 26, 14);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 2;
sunLight.shadow.camera.far = 75;
const sc = 23;
sunLight.shadow.camera.left = -sc;
sunLight.shadow.camera.right = sc;
sunLight.shadow.camera.top = sc;
sunLight.shadow.camera.bottom = -sc;
sunLight.shadow.bias = -0.0006;
scene.add(sunLight);

// --- ボクセル（ピクセル立方体）ビルダー ---
// 静的ブロックを1つのInstancedMeshにまとめて爆速描画
const VOX = 0.5; // 1ピクセルブロックのサイズ（ワールド単位）
const staticBlocks = [];
const glowBlocks = [];
const waterBlocks = [];
const streetLights = [];

function addBlock(gx, gy, gz, hex, scaleX = 1, scaleY = 1, scaleZ = 1) {
  staticBlocks.push({ x: gx * VOX, y: gy * VOX, z: gz * VOX, color: hex, sx: scaleX, sy: scaleY, sz: scaleZ });
}
function addGlow(gx, gy, gz, hex) {
  glowBlocks.push({ x: gx * VOX, y: gy * VOX, z: gz * VOX, color: hex });
}

// 簡易ハッシュ（草地の自然な色ムラ用）
function hash2(x, z) {
  const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

// --- 1. ピクセル大地・小川・広場・小道を生成 ---
const R = 33; // 半径（ボクセル数）
for (let x = -R; x <= R; x++) {
  for (let z = -R; z <= R; z++) {
    const dist = Math.hypot(x, z);
    if (dist > R + (hash2(x, z) - 0.5) * 1.4) continue;

    // 小川（x = -17〜-12 あたりを蛇行）
    const riverCenter = -15 + Math.sin(z * 0.14) * 2.2;
    const inRiver = Math.abs(x - riverCenter) < 2.6;

    // 石畳の広場（中央）と小道
    const inPlaza = Math.hypot(x, z - 1) < 9.2;
    const onBridge = Math.abs(z - 3) <= 2 && Math.abs(x - riverCenter) < 4.5;
    const onMainPath =
      (Math.abs(x) <= 1 && z >= -14 && z <= 16) ||
      (Math.abs(z - 3) <= 1 && x >= -22 && x <= 14) ||
      (Math.abs(z + 8) <= 1 && x >= -10 && x <= 12);

    // 浮島の土台（外周は薄く、中心は厚く）
    const depth = dist > R - 3 ? 2 : (dist > R - 7 ? 4 : 5);
    for (let d = 1; d <= depth; d++) {
      // 外側に見える側面だけ積んで負荷を削減
      if (d === 1 || dist > R - 5 || inRiver) {
        const soilCol = d % 2 === 0 ? 0x6b503c : 0x7a5c44;
        addBlock(x, -d, z, soilCol);
      }
    }

    if (inRiver && !onBridge) {
      // 川底と水面
      addBlock(x, -1, z, 0x4b5c5e);
      waterBlocks.push({ x: x * VOX, y: -0.18, z: z * VOX, phase: hash2(x, z) * 6.28 });
    } else if (onBridge) {
      // 木の橋
      const isRail = Math.abs(z - 3) === 2;
      addBlock(x, 0, z, 0x8f623d);
      if (isRail && x % 2 === 0) addBlock(x, 1, z, 0x6e4829);
    } else if (inPlaza || onMainPath) {
      // 石畳（色ムラ）
      const st = hash2(x, z);
      const col = st > 0.66 ? 0xd2cabd : (st > 0.33 ? 0xc2b9aa : 0xb5ab9b);
      addBlock(x, 0, z, col);
    } else {
      // 草地（ピクセルの濃淡）
      const g = hash2(x, z);
      const col = g > 0.72 ? 0x80a657 : (g > 0.35 ? 0x71974c : 0x648842);
      addBlock(x, 0, z, col);
      // ところどころに小さなピクセル花
      if (g > 0.965 && dist < R - 4 && dist > 11) {
        addBlock(x, 1, z, g > 0.985 ? 0xffe066 : 0xff8fa3, 0.45, 0.45, 0.45);
      }
    }
  }
}

// --- 2. ピクセル建築ジェネレーター（木組み＋段々屋根＋煙突＋光る窓） ---
function buildPixelHouse({ gx, gz, w, d, h, wallCol, timberCol = 0x5c3e28, roofCol, facing = 'S', chimney = false, awning = null }) {
  const x0 = gx - Math.floor(w / 2);
  const z0 = gz - Math.floor(d / 2);

  // 壁・木組み柱・ドア・窓
  for (let y = 1; y <= h; y++) {
    for (let dx = 0; dx < w; dx++) {
      for (let dz = 0; dz < d; dz++) {
        const isEdgeX = dx === 0 || dx === w - 1;
        const isEdgeZ = dz === 0 || dz === d - 1;
        if (!isEdgeX && !isEdgeZ) continue; // 中は空洞にして軽量化

        const wx = x0 + dx, wz = z0 + dz;
        const isCorner = isEdgeX && isEdgeZ;
        const isBeam = y === 1 || y === h;

        // 正面判定
        const isFront =
          (facing === 'S' && dz === d - 1) ||
          (facing === 'N' && dz === 0) ||
          (facing === 'E' && dx === w - 1) ||
          (facing === 'W' && dx === 0);

        const mid = (facing === 'S' || facing === 'N') ? Math.floor(w / 2) : Math.floor(d / 2);
        const posAlong = (facing === 'S' || facing === 'N') ? dx : dz;

        if (isFront && posAlong === mid && y <= 3) {
          // 木のドア
          addBlock(wx, y, wz, 0x52341e);
        } else if (isFront && (posAlong === mid - 2 || posAlong === mid + 2) && y === 3) {
          // 光る窓
          addGlow(wx, y, wz, 0xffc66d);
        } else if (!isFront && (dx === Math.floor(w / 2) || dz === Math.floor(d / 2)) && y === 3) {
          // 側面の窓
          addGlow(wx, y, wz, 0xffc66d);
        } else if (isCorner || isBeam) {
          // ハーフティンバーの木組み
          addBlock(wx, y, wz, timberCol);
        } else {
          addBlock(wx, y, wz, wallCol);
        }
      }
    }
  }

  // 段々ピクセル屋根
  const maxStep = Math.ceil(Math.min(w, d) / 2) + 1;
  for (let s = 0; s < maxStep; s++) {
    const ry = h + 1 + s;
    const rx0 = x0 - 1 + s;
    const rx1 = x0 + w - s;
    const rz0 = z0 - 1 + s;
    const rz1 = z0 + d - s;
    if (rx0 > rx1 || rz0 > rz1) break;
    for (let rx = rx0; rx <= rx1; rx++) {
      for (let rz = rz0; rz <= rz1; rz++) {
        // 外枠と最上段だけ積む
        if (rx === rx0 || rx === rx1 || rz === rz0 || rz === rz1 || s === maxStep - 1) {
          const shade = (rx + rz) % 2 === 0 ? roofCol : new THREE.Color(roofCol).multiplyScalar(0.9).getHex();
          addBlock(rx, ry, rz, shade);
        }
      }
    }
  }

  // 煙突
  let chimneyTop = null;
  if (chimney) {
    const cx = x0 + w - 2, cz = z0 + 1;
    for (let cy = h + 1; cy <= h + maxStep + 2; cy++) {
      addBlock(cx, cy, cz, cy % 2 === 0 ? 0x7d726a : 0x6b615a);
    }
    chimneyTop = new THREE.Vector3(cx * VOX, (h + maxStep + 3) * VOX, cz * VOX);
  }

  // 朝市のストライプ日よけ
  if (awning) {
    for (let dz = 0; dz < d; dz++) {
      const col = dz % 2 === 0 ? awning[0] : awning[1];
      addBlock(x0 - 1, 4, z0 + dz, col);
      addBlock(x0 - 2, 3, z0 + dz, col);
    }
  }

  // ドア前の座標を返す
  let doorX = gx, doorZ = gz;
  if (facing === 'S') doorZ = z0 + d + 1.5;
  if (facing === 'N') doorZ = z0 - 1.5;
  if (facing === 'E') doorX = x0 + w + 1.5;
  if (facing === 'W') doorX = x0 - 1.5;
  return { door: new THREE.Vector3(doorX * VOX, 0, doorZ * VOX), chimneyTop };
}

// 建物を配置
const bakery = buildPixelHouse({ gx: -7, gz: -14, w: 8, d: 7, h: 5, wallCol: 0xf6ebd8, roofCol: 0xc95b3c, facing: 'S', chimney: true });
const tavern = buildPixelHouse({ gx: 10, gz: -13, w: 9, d: 7, h: 6, wallCol: 0xe9d8be, roofCol: 0x456e52, facing: 'S', chimney: true });
const market = buildPixelHouse({ gx: 15, gz: 4, w: 7, d: 7, h: 5, wallCol: 0xf3e5d0, roofCol: 0x4e799c, facing: 'W', awning: [0xd9534f, 0xf7f2e7] });
const mill = buildPixelHouse({ gx: -24, gz: -4, w: 7, d: 7, h: 6, wallCol: 0xdfd9ce, roofCol: 0x6f6055, facing: 'E' });

const homeA = buildPixelHouse({ gx: -9, gz: 15, w: 7, d: 6, h: 4, wallCol: 0xf5ede2, roofCol: 0xa65242, facing: 'N' });
const homeB = buildPixelHouse({ gx: 2, gz: 17, w: 7, d: 6, h: 4, wallCol: 0xede5d7, roofCol: 0x6d755b, facing: 'N' });
const homeC = buildPixelHouse({ gx: 13, gz: 15, w: 7, d: 6, h: 4, wallCol: 0xf6ecda, roofCol: 0xb8703b, facing: 'N' });

// 朝市の野菜・果物木箱（ピクセル）
[[10, 2, 0xe05252], [10, 4, 0xf2b646], [10, 6, 0x5fb85f]].forEach(([bx, bz, col]) => {
  addBlock(bx, 1, bz, 0x996b40);
  addBlock(bx, 2, bz, col, 0.72, 0.45, 0.72);
});

// 中央のピクセル井戸
for (let dx = -1; dx <= 1; dx++) {
  for (let dz = -1; dz <= 1; dz++) {
    if (dx === 0 && dz === 0) {
      addBlock(dx, 1, dz + 1, 0x3b8ea5, 0.9, 0.6, 0.9);
    } else {
      addBlock(dx, 1, dz + 1, (dx + dz) % 2 === 0 ? 0x948e86 : 0x7f7972);
      addBlock(dx, 2, dz + 1, 0x8b857e, 0.95, 0.6, 0.95);
    }
  }
}
addBlock(-1, 3, 1, 0x5c3c24, 0.4, 1, 0.4);
addBlock(1, 3, 1, 0x5c3c24, 0.4, 1, 0.4);
addBlock(-1, 4, 1, 0x5c3c24, 0.4, 1, 0.4);
addBlock(1, 4, 1, 0x5c3c24, 0.4, 1, 0.4);
for (let dx = -2; dx <= 2; dx++) {
  for (let dz = -1; dz <= 1; dz++) {
    addBlock(dx, 5, dz + 1, 0x9c553b, 1, 0.6, 1);
  }
}
addBlock(0, 6, 1, 0x8a4830, 3, 0.6, 1);

// ピクセルベンチ2脚
function addPixelBench(gx, gz) {
  for (let i = -1; i <= 1; i++) {
    addBlock(gx + i, 1, gz, 0x8f5f38, 1, 0.45, 0.8);
    addBlock(gx + i, 2, gz - 0.35, 0x734a28, 1, 0.55, 0.25);
  }
  return new THREE.Vector3(gx * VOX, 0, (gz + 1) * VOX);
}
const bench1 = addPixelBench(5, 4);
const bench2 = addPixelBench(-5, 5);

// ピクセル街灯
function addPixelLamp(gx, gz) {
  for (let y = 1; y <= 5; y++) addBlock(gx, y, gz, 0x323840, 0.35, 1, 0.35);
  addGlow(gx, 6, gz, 0xffd275);
  const pt = new THREE.PointLight(0xffae42, 0, 10);
  pt.position.set(gx * VOX, 6.2 * VOX, gz * VOX);
  scene.add(pt);
  streetLights.push(pt);
}
addPixelLamp(-5, -5);
addPixelLamp(6, -5);
addPixelLamp(7, 8);
addPixelLamp(-6, 9);

// ピクセルの木々
function addPixelTree(gx, gz, h = 4) {
  for (let y = 1; y <= h; y++) addBlock(gx, y, gz, 0x6b4b32, 0.75, 1, 0.75);
  for (let ly = 0; ly < 3; ly++) {
    const rad = ly === 2 ? 1 : 2;
    for (let dx = -rad; dx <= rad; dx++) {
      for (let dz = -rad; dz <= rad; dz++) {
        if (Math.abs(dx) === rad && Math.abs(dz) === rad && ly !== 0) continue;
        const col = (dx + dz + ly) % 2 === 0 ? 0x4f824a : 0x3f6e3c;
        addBlock(gx + dx, h + 1 + ly, gz + dz, col);
      }
    }
  }
  addBlock(gx, h + 4, gz, 0x5c9454);
}
[
  [-26, 12, 4], [-25, -15, 5], [-16, -24, 4], [1, -24, 5],
  [20, -18, 4], [25, -4, 5], [24, 12, 4], [-1, 26, 4], [-18, 22, 4]
].forEach(([x, z, h]) => addPixelTree(x, z, h));

// --- InstancedMesh へ一気に流し込む ---
const boxGeo = new THREE.BoxGeometry(VOX, VOX, VOX);
const dummy = new THREE.Object3D();
const tmpCol = new THREE.Color();

const staticMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.88 });
const staticInst = new THREE.InstancedMesh(boxGeo, staticMat, staticBlocks.length);
staticInst.castShadow = true;
staticInst.receiveShadow = true;
staticBlocks.forEach((b, i) => {
  dummy.position.set(b.x, b.y, b.z);
  dummy.scale.set(b.sx, b.sy, b.sz);
  dummy.rotation.set(0, 0, 0);
  dummy.updateMatrix();
  staticInst.setMatrixAt(i, dummy.matrix);
  staticInst.setColorAt(i, tmpCol.setHex(b.color));
});
staticInst.instanceMatrix.needsUpdate = true;
staticInst.instanceColor.needsUpdate = true;
scene.add(staticInst);

// 光る窓・街灯のInstancedMesh
const glowMat = new THREE.MeshStandardMaterial({
  color: 0x3d4854, emissive: 0xffb84d, emissiveIntensity: 0, roughness: 0.35
});
const glowInst = new THREE.InstancedMesh(boxGeo, glowMat, glowBlocks.length);
glowBlocks.forEach((b, i) => {
  dummy.position.set(b.x, b.y, b.z);
  dummy.scale.set(1.02, 1.02, 1.02);
  dummy.updateMatrix();
  glowInst.setMatrixAt(i, dummy.matrix);
  glowInst.setColorAt(i, tmpCol.setHex(b.color));
});
glowInst.instanceMatrix.needsUpdate = true;
glowInst.instanceColor.needsUpdate = true;
scene.add(glowInst);

// 小川の水面InstancedMesh（波打ちアニメ用）
const waterMat = new THREE.MeshStandardMaterial({ color: 0x4ca8cc, roughness: 0.2, metalness: 0.1 });
const waterInst = new THREE.InstancedMesh(boxGeo, waterMat, waterBlocks.length);
waterInst.receiveShadow = true;
scene.add(waterInst);

// --- 回転するピクセル水車 ---
const waterWheel = new THREE.Group();
waterWheel.position.set(-19.8 * VOX, 2.4 * VOX, -4 * VOX);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x734b2b, roughness: 0.85 });
for (let a = 0; a < 12; a++) {
  const ang = (a / 12) * Math.PI * 2;
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), wheelMat);

    spoke.rotation.x = ang;
    waterWheel.add(spoke);

// --- 3. ピクセル積み上げ（Sprite Stacking風）村人ジェネレーター ---
// 1ドット = 0.11ワールド単位で、下から上へドット絵スライスを重ねて立体キャラを生成
const PX = 0.11;
const pxGeo = new THREE.BoxGeometry(PX, PX, PX);

function buildPixelStackVillager(palette) {
  // パレット: c=服, a=アクセント(エプロン/帯), s=肌, h=髪/帽子, e=目, b=靴
  const root = new THREE.Group();

  // 左右の足（パタパタ歩くアニメーション用）
  const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(PX * 1.6, PX * 2.2, PX * 1.6), new THREE.MeshStandardMaterial({ color: palette.b }));
  leftLeg.position.set(-PX * 1.1, PX * 1.1, 0);
  leftLeg.castShadow = true;
  const rightLeg = leftLeg.clone();
  rightLeg.position.x = PX * 1.1;
  root.add(leftLeg, rightLeg);

  // 胴体＋頭＋帽子をドット絵スライス配列から縦に積み上げ！
  // 各層は 5x5 の2Dドットパターン（奥→手前）
  const layers = [
    // 胴体下部（3層）
    ['.ccc.', 'ccccc', 'ccacc', 'ccacc', '.cac.'],
    ['.ccc.', 'ccccc', 'ccacc', 'ccacc', '.cac.'],
    ['.ccc.', 'ccccc', 'ccccc', 'ccacc', '.cac.'],
    // 胸・肩（2層）
    ['.ccc.', 'ccccc', 'ccccc', 'ccccc', '.ccc.'],
    ['..c..', '.ccc.', '.ccc.', '.ccc.', '..c..'],
    // 顔（3層：手前側z=4に目）
    ['.hhh.', 'hsssh', 'hsssh', 'hsssh', '.sss.'],
    ['.hhh.', 'hsssh', 'hsssh', 'hsssh', '.ses.'], // 目
    ['.hhh.', 'hsssh', 'hsssh', 'hsssh', '.sss.'],
    // 帽子・頭頂（3層）
    ['hhhhh', 'hhhhh', 'hhhhh', 'hhhhh', 'hhhhh'],
    ['.hhh.', 'hhhhh', 'hhhhh', 'hhhhh', '.hhh.'],
    ['..h..', '.hhh.', '.hhh.', '.hhh.', '..h..']
  ];

  const bodyGroup = new THREE.Group();
  const voxels = [];
  layers.forEach((grid, ly) => {
    grid.forEach((row, rz) => {
      for (let rx = 0; rx < row.length; rx++) {
        const ch = row[rx];
        if (ch === '.') continue;
        // 目の位置は左右2ドットにする
        if (ch === 'e' && rx === 2) {
          voxels.push({ x: (rx - 2) * PX, y: (ly + 2.5) * PX, z: (rz - 2) * PX, col: palette.s });
          continue;
        }
        let col = palette[ch];
        if (ly === 6 && rz === 4 && (rx === 1 || rx === 3)) col = palette.e;
        voxels.push({ x: (rx - 2) * PX, y: (ly + 2.5) * PX, z: (rz - 2) * PX, col });
      }
    });
  });

  const vInst = new THREE.InstancedMesh(pxGeo, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 }), voxels.length);
  vInst.castShadow = true;
  voxels.forEach((v, i) => {
    dummy.position.set(v.x, v.y, v.z);
    dummy.scale.set(1, 1, 1);
    dummy.updateMatrix();
    vInst.setMatrixAt(i, dummy.matrix);
    vInst.setColorAt(i, tmpCol.setHex(v.col));
  });
  vInst.instanceMatrix.needsUpdate = true;
  vInst.instanceColor.needsUpdate = true;
  bodyGroup.add(vInst);
  root.add(bodyGroup);

  // タップ判定用
  const hitBox = new THREE.Mesh(
    new THREE.BoxGeometry(0.95, 1.8, 0.95),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  hitBox.position.y = 0.9;
  root.add(hitBox);

  scene.add(root);
  return { root, bodyGroup, leftLeg, rightLeg, hitBox };
}

// --- ウェイポイント（橋と広場をちゃんと通る経路計算） ---
const WP_PLAZA = new THREE.Vector3(0, 0, 1.5);
const WP_BRIDGE_E = new THREE.Vector3(-5.2, 0, 1.5);
const WP_BRIDGE_W = new THREE.Vector3(-9.8, 0, 1.5);

function buildWaypoints(from, to) {
  const pts = [];
  const fromWest = from.x < -7.5;
  const toWest = to.x < -7.5;
  if (fromWest && !toWest) {
    pts.push(WP_BRIDGE_W.clone(), WP_BRIDGE_E.clone(), WP_PLAZA.clone());
  } else if (!fromWest && toWest) {
    pts.push(WP_PLAZA.clone(), WP_BRIDGE_E.clone(), WP_BRIDGE_W.clone());
  } else if (from.distanceTo(to) > 8.5) {
    pts.push(WP_PLAZA.clone());
  }
  pts.push(to.clone());
  return pts;
}

// --- 空と光の時間遷移 ---
const skyColors = {
  night: new THREE.Color(0x131d2c),
  dawn: new THREE.Color(0xe69b72),
  day: new THREE.Color(0x8ecbe8),
  dusk: new THREE.Color(0xd97952)
};
let currentLampGlow = 0;

function updateEnvironment(hour) {
  const sky = new THREE.Color();
  let sunIntensity = 2.1;
  let lampGlow = 0;
  let period = '昼';
  let desc = '広場に穏やかな陽射しが降り注いでいる';

  if (hour >= 5 && hour < 7.5) {
    const t = (hour - 5) / 2.5;
    sky.lerpColors(skyColors.night, skyColors.dawn, Math.min(t * 1.4, 1));
    if (t > 0.5) sky.lerp(skyColors.day, (t - 0.5) * 2);
    sunIntensity = 0.45 + t * 1.7;
    lampGlow = 1 - t;
    period = '朝';
    desc = 'パン屋の煙突から朝一番の煙がのぼる';
  } else if (hour >= 7.5 && hour < 16.5) {
    sky.copy(skyColors.day);
    sunIntensity = 2.2;
    lampGlow = 0;
    period = '昼';
    desc = '井戸端や朝市に村人たちの話し声が響く';
  } else if (hour >= 16.5 && hour < 19.5) {
    const t = (hour - 16.5) / 3.0;
    sky.lerpColors(skyColors.day, skyColors.dusk, Math.min(t * 1.4, 1));
    if (t > 0.55) sky.lerp(skyColors.night, (t - 0.55) * 2.2);
    sunIntensity = 2.1 - t * 1.75;
    lampGlow = t;
    period = '夕暮れ';
    desc = '茜色の空の下、街灯と酒場に灯りがともる';
  } else {
    sky.copy(skyColors.night);
    sunIntensity = 0.3;
    lampGlow = 1;
    period = '夜';
    desc = '家々の窓に灯りがともり、ホタルが舞う';
  }

  currentLampGlow = lampGlow;
  scene.background = sky;
  scene.fog.color.copy(sky);
  sunLight.intensity = sunIntensity;

  const angle = ((hour - 6) / 24) * Math.PI * 2;
  sunLight.position.set(Math.cos(angle) * 24, Math.max(Math.sin(angle) * 26, 6), 14);

  glowMat.emissiveIntensity = lampGlow * 1.45;
  streetLights.forEach(pt => { pt.intensity = lampGlow * 4.2; });
  ffMat.opacity = Math.max(0, (lampGlow - 0.3) * 1.3);

  const hh = String(Math.floor(hour)).padStart(2, '0');
  const mm = String(Math.floor((hour % 1) * 60)).padStart(2, '0');
  clockText.textContent = `${hh}:${mm} ${period}`;
  weatherText.textContent = desc;
}

// --- メインループ ---
const clock = new THREE.Clock();
const projVec = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime;

  if (!isPaused) {
    gameHour = (gameHour + (dt / 95) * 24 * timeScale) % 24;
    waterWheel.rotation.x -= dt * 0.95 * timeScale;
  }

  updateEnvironment(gameHour);

  // 小川の波打ちアニメーション
  waterBlocks.forEach((w, i) => {
    dummy.position.set(w.x, w.y + Math.sin(elapsed * 2.6 + w.phase) * 0.04, w.z);
    dummy.scale.set(1, 0.5, 1);
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    waterInst.setMatrixAt(i, dummy.matrix);
  });
  waterInst.instanceMatrix.needsUpdate = true;

  // 煙突のピクセル煙
  smokeParticles.forEach(p => {
    const t = (elapsed * p.userData.speed + p.userData.phase) % 1;
    p.position.set(
      p.userData.origin.x + Math.sin(elapsed * 1.4 + p.userData.phase) * 0.2 + t * 0.35,
      p.userData.origin.y + t * 2.5,
      p.userData.origin.z + Math.cos(elapsed * 1.1 + p.userData.phase) * 0.18
    );
    const s = 0.6 + t * 1.1;
    p.scale.setScalar(s);
    p.material.opacity = (1 - t) * 0.55;
  });

  // 夜のホタル
  if (ffMat.opacity > 0.02) {
    fireflies.forEach(f => {
      const d = f.userData;
      f.position.set(
        d.bx + Math.sin(elapsed * 0.8 + d.phase) * 1.2,
        d.by + Math.sin(elapsed * 1.9 + d.phase) * 0.35,
        d.bz + Math.cos(elapsed * 0.7 + d.phase) * 1.2
      );
    });
  }

  // 村人の自律行動 & 会話ロジック
  villagers.forEach((v, i) => {
    const slot = v.schedule.find(s => gameHour >= s.start && gameHour < s.end) || v.schedule[0];
    v.currentText = slot.text;

    // 目的地が変わったら橋や広場を経由するルートを計算
    if (v.lastSlotTarget !== slot.target) {
      v.lastSlotTarget = slot.target;
      v.waypoints = buildWaypoints(v.pos, slot.target);
    }

    if (!isPaused) {
      if (v.speechTimer > 0) v.speechTimer -= dt;
      v.monoCooldown -= dt;

      if (v.waypoints.length > 0) {
        const nextPt = v.waypoints[0];
        const toNext = new THREE.Vector3().subVectors(nextPt, v.pos);
        toNext.y = 0;
        const dist = toNext.length();

        if (dist > 0.25) {
          v.mesh.root.visible = true;
          toNext.normalize();
          v.pos.addScaledVector(toNext, v.speed * dt * Math.min(timeScale, 2.5));
          v.mesh.root.position.copy(v.pos);
          v.mesh.root.rotation.y = Math.atan2(toNext.x, toNext.z);

          // パタパタ歩きモーション
          const walkCycle = elapsed * 10 + v.phase;
          v.mesh.leftLeg.rotation.x = Math.sin(walkCycle) * 0.6;
          v.mesh.rightLeg.rotation.x = -Math.sin(walkCycle) * 0.6;
          v.mesh.bodyGroup.position.y = Math.abs(Math.sin(walkCycle)) * 0.06;
        } else {
          v.waypoints.shift();
        }
      } else {
        // 目的地に到着
        v.mesh.leftLeg.rotation.x = 0;
        v.mesh.rightLeg.rotation.x = 0;

        if (slot.sleep) {
          v.mesh.root.visible = false;
          v.speechTimer = 0;
        } else {
          v.mesh.root.visible = true;
          v.mesh.bodyGroup.position.y = Math.sin(elapsed * 2.4 + v.phase) * 0.02;

          // 近くに起きている村人がいれば立ち話！
          let partner = null;
          for (let j = 0; j < villagers.length; j++) {
            if (i === j || !villagers[j].mesh.root.visible) continue;
            if (v.pos.distanceTo(villagers[j].pos) < 2.8) {
              partner = villagers[j];
              break;
            }
          }

          if (partner) {
            const lookDir = new THREE.Vector3().subVectors(partner.pos, v.pos);
            v.mesh.root.rotation.y = Math.atan2(lookDir.x, lookDir.z);
            v.currentText = `${partner.fullName}と立ち話をしています。`;

            // 交互に吹き出し会話を発生
            if (v.speechTimer <= 0 && partner.speechTimer <= 0) {
              const pair = CHAT_PAIRS[Math.floor((elapsed * 0.5 + i) % CHAT_PAIRS.length)];
              v.speechText = pair[0];
              v.speechIsChat = true;
              v.speechTimer = 3.2;

              // 少し遅れて相手が返事する演出
              setTimeout(() => {
                if (partner.mesh.root.visible && partner.pos.distanceTo(v.pos) < 3.2) {
                  partner.speechText = pair[1];
                  partner.speechIsChat = true;
                  partner.speechTimer = 3.2;
                }
              }, 1100);
            }
          } else if (v.monoCooldown <= 0 && v.speechTimer <= 0) {
            // ときどき独り言
            v.speechText = v.monologues[Math.floor(Math.random() * v.monologues.length)];
            v.speechIsChat = false;
            v.speechTimer = 2.8;
            v.monoCooldown = 9 + Math.random() * 8;
          }
        }
      }
    }

    // 頭上の吹き出し座標を3D→2D投影して更新
    if (showBubbles && v.mesh.root.visible && v.speechTimer > 0) {
      projVec.set(v.pos.x, v.pos.y + 2.05, v.pos.z);
      projVec.project(camera);
      if (projVec.z < 1) {
        const sx = (projVec.x * 0.5 + 0.5) * window.innerWidth;
        const sy = (-projVec.y * 0.5 + 0.5) * window.innerHeight;
        v.bubbleEl.style.left = `${sx}px`;
        v.bubbleEl.style.top = `${sy}px`;
        v.bubbleEl.innerHTML = `<span class="spk">${v.name}</span>${v.speechText}`;
        v.bubbleEl.classList.toggle('chat', v.speechIsChat);
        v.bubbleEl.classList.add('show');
      } else {
        v.bubbleEl.classList.remove('show');
      }
    } else {
      v.bubbleEl.classList.remove('show');
    }
  });

  // 追尾カメラ
  if (selectedVillager) {
    vStatus.textContent = selectedVillager.currentText;
    if (selectedVillager.mesh.root.visible) {
      controls.target.lerp(new THREE.Vector3(selectedVillager.pos.x, 1.0, selectedVillager.pos.z), 0.08);
    }
  } else {
    controls.target.lerp(new THREE.Vector3(0, 1.2, 0), 0.05);
  }

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
